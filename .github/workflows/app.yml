name: app
# Builds the Android app (android-app/) and publishes the installable file as a release.
# It runs when the app's own code changes, not when places are added: the app fetches new places itself.
# On a pull request it builds a test copy. After a merge it is started by site.yml, once the built site is on main
# (a merge no longer carries the built app.js, so a push to main cannot start it directly).
on:
  pull_request:
    paths: ['android-app/**', 'source/src/**', 'app.js', 'boot.js', 'leaflet.js', '.github/workflows/app.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # The signing key belongs in the environment "release" (Settings, Environments), which GitHub can be told to hand only to
    # runs on main. A run that is not a pull request asks for that environment; a pull request never does, so once the key is
    # kept there and nowhere else, a branch cannot reach it: its app is compiled to prove it builds, and is neither signed
    # nor published. Until the owner moves the key (GUIDE.md section 12), the two repository secrets still work as before.
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'
      - name: Build the site from this pull request's sources
        if: github.event_name == 'pull_request'
        run: |
          pip install --quiet requests Pillow numpy rasterio
          bash source/tools/ci_build.sh
      - name: Put the built Atlas inside the app
        working-directory: android-app
        run: |
          npm ci
          node scripts/make-www.js
          npx cap sync android
      - name: Signing key
        id: key
        env:
          KEY: ${{ secrets.ATLAS_KEYSTORE_B64 }}
          PASS: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PASS" ]; then
            echo "$KEY" | base64 -d > "$RUNNER_TEMP/atlas.jks"
            echo "ATLAS_KEYSTORE=$RUNNER_TEMP/atlas.jks" >> "$GITHUB_ENV"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key reached this run (the secrets ATLAS_KEYSTORE_B64 and ATLAS_KEYSTORE_PASSWORD). On a pull request that is as it should be once the key is kept in the release environment. The app was built to prove it compiles, but it is not signed with the Atlas key, cannot update an installed copy, and was not published. See GUIDE.md section 12."
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the app
        working-directory: android-app/android
        env:
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PatlasVersionCode=$((100 + GITHUB_RUN_NUMBER)) -PatlasVersionName=0.1.$GITHUB_RUN_NUMBER
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lost-hidden-atlas.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.signed == 'yes' && 'lost-hidden-atlas-apk' || 'NOT-SIGNED-compile-test-only' }}
          path: ${{ runner.temp }}/lost-hidden-atlas.apk
      - name: Publish the app (after a merge)
        if: steps.key.outputs.signed == 'yes' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/lost-hidden-atlas.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Atlas app 0.1.$GITHUB_RUN_NUMBER" \
            --notes "Android app. On the phone, download lost-hidden-atlas.apk below and open it to install or update. Your notes and field logs are kept."
      - name: Publish a test build (for a pull request)
        if: steps.key.outputs.signed == 'yes' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-test-$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/lost-hidden-atlas.apk" --repo "$GITHUB_REPOSITORY" --target "${{ github.event.pull_request.head.sha }}" --prerelease \
            --title "TEST build 0.1.$GITHUB_RUN_NUMBER (pull request #${{ github.event.pull_request.number }}, not merged)" \
            --notes "A test build of the Android app from pull request #${{ github.event.pull_request.number }}. Install it to try the change before merging. It installs over the released app and keeps your data."
