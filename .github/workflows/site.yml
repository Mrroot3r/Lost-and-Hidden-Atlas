name: site
# Builds the site after a merge and publishes it by committing the built files to main (GUIDE.md section 3).
# Pull requests carry sources only, so two of them can never disagree over the built files.
# If this fails, the site simply stays as it was. Open the failed run, press "Re-run all jobs", and tell a model if it
# fails twice. A session can also publish the old way: FULL=1 tools/publish.sh.
on:
  push:
    branches: [main]
    paths: ['source/**', 'data/**', 'android-app/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # the newest main, not the commit that started this run: an earlier run may have published since
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site
        id: build
        run: |
          set -o pipefail
          pip install --quiet requests Pillow numpy rasterio
          bash source/tools/ci_build.sh | tee "$RUNNER_TEMP/build.log"
          if tail -1 "$RUNNER_TEMP/build.log" | grep -q "new version"; then echo "changed=yes" >> "$GITHUB_OUTPUT"; else echo "changed=no" >> "$GITHUB_OUTPUT"; fi
      - name: Check what was built
        if: steps.build.outputs.changed == 'yes'
        run: |
          python3 source/tools/check.py .
          node -e "new Function(require('fs').readFileSync('app.js','utf8'))"
      - name: It opens at phone size
        if: steps.build.outputs.changed == 'yes'
        run: |
          # the test's own packages go outside the checkout, so they cannot end up in the commit below
          (cd "$RUNNER_TEMP" && npm install --no-save playwright && npx playwright install --with-deps chromium)
          python3 -m http.server 8766 &
          sleep 2
          NODE_PATH="$RUNNER_TEMP/node_modules" node source/tools/smoke.js http://localhost:8766/
      - name: Publish
        id: publish
        if: steps.build.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain -- app.js boot.js leaflet.js)" ]; then echo "app=yes" >> "$GITHUB_OUTPUT"; fi
          git config user.name "atlas-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(python3 -c "import json;print(json.load(open('version.json'))['v'])") (from ${GITHUB_SHA::7})"
          if ! git push origin HEAD:main 2> "$RUNNER_TEMP/push.err"; then
            cat "$RUNNER_TEMP/push.err"
            if grep -q "fetch first\|non-fast-forward" "$RUNNER_TEMP/push.err"; then
              echo "::notice::main moved while this was building. Nothing was published by this run; the run that the newer merge started will publish everything."
              echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::The built site could not be pushed to main (the reason is above). The site was NOT updated. A session can publish the old way with FULL=1 tools/publish.sh."
            exit 1
          fi
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
          # A push made by a workflow does not always start the Pages build, so ask for one.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null 2>&1 && echo "Asked Pages for a build." || echo "::notice::Could not ask Pages for a build."
      - name: Build the Android app when its code changed
        if: success() && steps.publish.outputs.pushed != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          APP="${{ steps.publish.outputs.app }}"
          if [ -z "$APP" ] && [ -n "$BEFORE" ] && gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null | grep -q '^android-app/'; then APP=yes; fi
          if [ "$APP" = "yes" ]; then gh workflow run app.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "Started the app build."; else echo "The app's code did not change."; fi
