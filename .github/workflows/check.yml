name: check
# Runs on every pull request. A pull request carries sources only, so the site is built here first, from those sources,
# and the checks then look at what was built. Nothing is published from here; that is site.yml, after the merge.
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site from this pull request's sources
        run: |
          pip install --quiet requests Pillow numpy rasterio
          bash source/tools/ci_build.sh
      - name: Place lists are valid and the built site matches the sources
        run: python3 source/tools/check.py .
      - name: The LiDAR ledger tool keeps its rules
        run: python3 source/tools/lidar_test.py
      - name: The stone-wall finder still tells a wall from a bank
        run: |
          pip install --quiet scipy scikit-image
          python3 source/tools/walls_test.py
      - name: App script parses
        run: node -e "new Function(require('fs').readFileSync('source/src/app.js','utf8'))"
      - name: The site opens at phone size
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8766 &
          sleep 2
          node source/tools/smoke.js http://localhost:8766/
  # A pull request that only adds or changes places merges by itself once everything above has passed (GUIDE.md section 3).
  # Only from a branch of this repository: a pull request from somebody's copy always waits for the owner, and GitHub
  # gives such a run a read-only token in any case. This job runs none of the pull request's own code.
  merge:
    needs: check
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Merge a research-only pull request and mark it not double-checked
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FILES=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --paginate --jq '.[].filename')
          OTHER=$(echo "$FILES" | grep -v -E '^(source/tools/data_[a-z0-9_]+\.py|source/tools/bricks_[a-z0-9_]+\.py|notes/[A-Za-z0-9_.-]+\.md|LEADS\.md)$' || true)
          CORE=$(echo "$FILES" | grep -E '^source/tools/data_(a|b|states)\.py$' || true)
          if [ -z "$FILES" ] || [ -n "$OTHER" ] || [ -n "$CORE" ]; then echo "This pull request changes more than place lists, brick files and notes. It waits for the owner."; exit 0; fi
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -qx 'hold'; then echo "Labelled hold. It waits for the owner."; exit 0; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/labels" -f name='not double-checked' -f color='fbca04' -f description='Research that merged by itself: nobody has looked at its pins and sources a second time' > /dev/null 2>&1 || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=not double-checked' > /dev/null
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f merge_method=merge -f sha="$SHA" > /dev/null
          echo "Merged #$PR as research only, labelled not double-checked."
          # a merge made by a workflow starts no other workflow, so ask for the site build by name
          gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "Started the site build."
