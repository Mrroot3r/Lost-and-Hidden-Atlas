/* Layout: one-screen survey desk. Index panel on the left, map sheet on the right; on a phone the sheet sits on top.
   Vernacular: USGS quadrangle. Contour brown, water blue, and the purple USGS printed for photo-revisions is the accent. */
:root{
  --bg:#eef0ec; --panel:#fbfcfa; --ink:#1b221e; --mute:#5b6660; --line:#d5dad4; --chip:#e5e9e3;
  --accent:#a3238e; --accent-ink:#ffffff; --accent-soft:#f3e3f0; --brown:#8f5a2b; --water:#2f7fb5;
  --ok:#2e7d4f; --warn:#b3541e; --warn-soft:#f8eadf; --pinring:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.10);
  --ff:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'IBM Plex Sans Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a1f1c; --ink:#e7ece8; --mute:#98a39d; --line:#2e3531; --chip:#262d29;
  --accent:#e58ad6; --accent-ink:#1d0f1a; --accent-soft:#3a2436; --brown:#d6a071; --water:#6db3e0;
  --ok:#6fcf97; --warn:#f0a36b; --warn-soft:#3b2a1e; --pinring:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a1f1c; --ink:#e7ece8; --mute:#98a39d; --line:#2e3531; --chip:#262d29;
  --accent:#e58ad6; --accent-ink:#1d0f1a; --accent-soft:#3a2436; --brown:#d6a071; --water:#6db3e0;
  --ok:#6fcf97; --warn:#f0a36b; --warn-soft:#3b2a1e; --pinring:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ff);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--fc);margin:0;text-wrap:balance}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);height:100%;min-height:0}
#side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line);z-index:2}
#stage{position:relative;min-height:0;min-width:0;background:var(--bg)}
#map{position:absolute;inset:0;background:var(--bg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(220px,44%) minmax(0,1fr)}
  #stage{order:-1} #side{border-right:0;border-top:1px solid var(--line)}
  #app.mapbig{grid-template-rows:minmax(0,1fr) 54px} #app.mapbig .view{display:none}
}

/* header */
.top{padding-block:10px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);position:relative}
.mark::before,.mark::after{content:"";position:absolute;background:var(--accent)}
.mark::before{left:50%;top:-6px;bottom:-6px;width:2px;transform:translateX(-50%)}
.mark::after{top:50%;left:-6px;right:-6px;height:2px;transform:translateY(-50%)}
.brand h1{font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.brand p{margin:0;color:var(--mute);font-size:12px}
.tabs{display:flex;gap:2px;margin-top:8px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:7px 4px 6px;font-family:var(--fc);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--fm);font-size:11px;background:var(--chip);border-radius:9px;padding:1px 6px;margin-left:4px}
.view{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}

/* controls */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.field>span,.lbl{font-family:var(--fc);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=search],input[type=url],select,textarea{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{resize:vertical;min-height:64px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:14px;padding:3px 9px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;line-height:1.25}
button.chip:hover{border-color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c,#888);box-shadow:0 0 0 1.5px var(--panel),0 0 0 2.5px rgba(0,0,0,.35)}
.dot.hollow{background:var(--panel);box-shadow:inset 0 0 0 2.5px var(--c,#888),0 0 0 1px rgba(0,0,0,.3)}
.dot.sq{border-radius:2px}
.tag{font-family:var(--fc);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:1px 6px;background:var(--chip);color:var(--mute);white-space:nowrap}
.tag.now{background:var(--warn-soft);color:var(--warn)}
.tag.lead{background:var(--warn-soft);color:var(--warn)}
.tag.p-exact{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.p-site{background:color-mix(in srgb,var(--water) 20%,transparent);color:var(--water)}
.tag.p-area{background:var(--warn-soft);color:var(--warn)}

/* list view */
.tools{padding-block:10px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.presets{display:flex;gap:5px;flex-wrap:wrap}
details.filters{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details.filters>summary{cursor:pointer;padding:7px 10px;font-family:var(--fc);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.filters>summary::-webkit-details-marker{display:none}
details.filters>summary::after{content:"+";font-family:var(--fm)}
details.filters[open]>summary::after{content:"\2212"}
.fbody{padding:4px 10px 10px;display:flex;flex-direction:column;gap:9px}
.fgrp{display:flex;flex-direction:column;gap:4px}
.count{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font-size:12.5px}
.count select{width:auto;padding:3px 6px}
#list{list-style:none;margin:0;padding:0}
#list li{border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;padding-block:9px}
.item:hover,.item.cur{background:var(--bg)}
.item .dot{margin-top:5px}
.item b{display:block;font-weight:600;line-height:1.25}
.item small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.item .mins{font-family:var(--fm);font-size:12.5px;color:var(--mute);white-space:nowrap;text-align:right}
.item .mins i{display:block;font-style:normal;font-size:10.5px}
.empty{padding-block:28px;color:var(--mute);text-align:center}

/* detail */
.dhead{padding-block:10px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3}
.dhead h2{font-size:22px;line-height:1.12;margin-top:6px}
.dhead .sub2{color:var(--mute);margin:2px 0 0}
.dmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sec{padding-block:12px;border-bottom:1px solid var(--line)}
.sec h3{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sec p{margin:0 0 8px;max-width:65ch} .sec p:last-child{margin-bottom:0}
.hook{border-left:3px solid var(--accent);padding-left:10px;font-style:italic}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.kv dt{color:var(--mute);font-size:12.5px}.kv dd{margin:0}
.scout{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.scout .btn{justify-content:flex-start}
.times{display:flex;flex-wrap:wrap;gap:6px}
.time{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--mute)}
.time b{font-family:var(--fm);font-size:14px;color:var(--ink);display:block}
.time.home{border-color:var(--accent)}
.pn{background:var(--accent-soft);border-radius:6px;padding:8px 10px;font-size:13px}
.links{margin:0;padding-left:18px}.links li{margin:2px 0}
.near{list-style:none;margin:0;padding:0}.near li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.near button{background:none;border:0;padding:0;color:var(--accent);text-align:left}
.near span{font-family:var(--fm);font-size:12px;color:var(--mute);white-space:nowrap}
.hist{display:flex;flex-direction:column;gap:6px}
.hist img{display:block;width:100%;max-width:340px;border:1px solid var(--line);border-radius:4px}
input[type=range]{width:100%;accent-color:var(--accent)}
.note-saved{font-size:12px;color:var(--ok)}

/* trip + guide */
.stops{list-style:none;margin:0;padding:0;counter-reset:s}
.stops li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);counter-increment:s}
.stops li::before{content:counter(s);font-family:var(--fm);font-size:12px;color:var(--mute)}
.stops small{display:block;color:var(--mute);font-size:12px}
.stops .mv{display:flex;gap:3px}
.guide details{border-bottom:1px solid var(--line)}
.guide summary{cursor:pointer;padding-block:11px;font-family:var(--fc);font-weight:600;font-size:16px}
.guide .gb{padding-bottom:12px}
.guide .gb p,.guide .gb li{max-width:65ch}
.guide ul{margin:0 0 8px;padding-left:18px}
.series{display:flex;flex-direction:column;gap:8px}
.series button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.series button:hover{border-color:var(--accent)}
.series b{font-family:var(--fc);font-size:15px;display:block}
.series small{color:var(--mute);display:block}
.tk{display:flex;flex-direction:column;gap:7px}
.tk a{font-weight:600}.tk span{display:block;color:var(--mute);font-size:12.5px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px 10px}
.legend span{display:flex;align-items:center;gap:7px;font-size:12.5px}

/* map furniture */
.float{position:absolute;z-index:1100;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.lopt{display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.25}
.lopt small{display:block;color:var(--mute);font-size:11.5px}
.lsub{margin-left:22px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lsub select{width:auto;padding:3px 6px;font-size:12.5px}
.lhr{border:0;border-top:1px solid var(--line);margin:2px 0}
#banner{cursor:pointer;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom,0px));padding:7px 12px;font-size:12.5px;max-width:min(520px,calc(100% - 24px));text-align:center}
#banner.warn{border-color:var(--warn);background:var(--warn-soft)}
#readout{left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));padding:4px 8px;font-size:11.5px;color:var(--mute)}
#addbar{left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));padding:8px 12px;display:flex;gap:10px;align-items:center;border-color:var(--accent)}
#swipe{position:absolute;top:0;bottom:0;width:0;z-index:1050;border-left:2px solid var(--accent);pointer-events:none}
#swipe .grip{position:absolute;top:50%;left:-19px;width:36px;height:36px;margin-top:-18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--fm);font-size:13px;pointer-events:auto;cursor:ew-resize;touch-action:none;box-shadow:var(--shadow)}
#swipe .side{position:absolute;top:calc(48px + env(safe-area-inset-top,0px));font-family:var(--fc);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 6px;white-space:nowrap}
#swipe .side.l{right:8px}#swipe .side.r{left:8px}
@media (max-width:820px){#readout{display:none} .leaflet-control-zoom{display:none}}

/* pins */
.pinwrap{background:none;border:0}
.pin{display:block;width:16px;height:16px;margin:3px;border-radius:50%;background:var(--c,#888);border:2px solid var(--pinring);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5)}
.pin.hollow{background:#fff;border:3.5px solid var(--c,#888);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5)}
.pin.sq{border-radius:3px}
.pin.mine{border-radius:2px;transform:rotate(45deg)}
.pin.my-filmed,.pin.my-skip{opacity:.45}
.pin.sel{outline:3px solid var(--accent);outline-offset:3px}
.pin.now{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 0 rgba(240,120,30,.7)}100%{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 12px rgba(240,120,30,0)}}
@media (prefers-reduced-motion:reduce){.pin.now{animation:none;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 4px rgba(240,120,30,.6)}}
.zfar .pin{width:10px;height:10px;margin:6px;border-width:1.5px}
.zfar .pin.hollow{border-width:2.5px}
.homepin{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--panel);font-family:var(--fc);font-weight:700;font-size:12px;border:2px solid var(--pinring);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.thpin{display:grid;place-items:center;width:20px;height:20px;border-radius:4px;background:#1f5fbf;color:#fff;font-family:var(--fc);font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.townlbl{font-family:var(--fc);font-weight:600;font-size:12px;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 3px var(--bg)}
.townlbl.big{font-size:14px;letter-spacing:.03em;text-transform:uppercase}
.leaflet-container{font-family:var(--ff);background:var(--bg)}
.leaflet-tooltip{font-family:var(--ff);font-size:12.5px;font-weight:500}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.ctx{display:flex;flex-direction:column;gap:5px;min-width:190px}
.ctx .btn{justify-content:flex-start;color:#1b221e;background:#fff;border-color:#d5dad4}
.leaflet-control-attribution{font-size:10px}
.cmp-swipe{will-change:clip}
.adding #map{cursor:crosshair}
.adding .leaflet-grab,.adding .leaflet-interactive{cursor:crosshair}

/* lines + locate */
.sw{display:inline-block;flex:none;width:18px;height:0;border-top:3px solid var(--c,#888);vertical-align:middle}
.sw.dash{border-top-style:dashed}
.lkey{display:inline-flex;align-items:center;gap:5px;margin-right:9px;white-space:nowrap}
.chip .x{background:none;border:0;padding:0 0 0 4px;font-size:12px;color:var(--mute)}
.near button .sw{margin-right:2px}
.loc{width:12px;height:12px;border-radius:50%;background:#1f6feb;box-shadow:0 0 0 2px #fff,0 0 0 3px #1f6feb}


.offl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.offmsg{margin:0;font-size:12.5px;color:var(--mute)}
.bar{width:100%;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* ---- layer bar, options sheet, land and owner lookups (November 2026) ---- */
[hidden]{display:none!important}
:root{--barh:0px}
#lbar{position:absolute;z-index:1100;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));max-width:calc(100% - 20px);display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.lscroll{display:flex;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;min-width:0}
.lscroll::-webkit-scrollbar{display:none}
.lfix{display:flex;flex:none;border-left:1px solid var(--line)}
.lb{flex:none;min-width:54px;height:52px;padding:5px 6px 2px;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--mute);font-family:var(--fc);font-size:11px;font-weight:600;letter-spacing:.02em;line-height:1.1;white-space:nowrap;cursor:pointer}
.lb .ic{display:grid;place-items:center;height:24px}
.lb:hover{color:var(--ink)}
.lb[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.lb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lsep{flex:none;width:1px;margin:9px 3px;background:var(--line)}
#lb-big{display:none}
#readout{top:auto;bottom:calc(34px + env(safe-area-inset-bottom,0px))}
#addbar{top:calc(74px + env(safe-area-inset-top,0px));max-width:calc(100% - 24px)}
#swipe .side{top:calc(74px + env(safe-area-inset-top,0px))}
#scrim{position:fixed;inset:0;z-index:2990;background:transparent}
#sheet{position:fixed;z-index:3000;right:16px;top:76px;width:350px;max-width:calc(100vw - 32px);max-height:calc(100vh - 100px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
#sheet>header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#sheet h2{margin:0;font-family:var(--fc);font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
#sheet-x{min-width:76px;justify-content:center}
#sheet-b{overflow:auto;-webkit-overflow-scrolling:touch;padding:2px 14px 18px;display:flex;flex-direction:column;gap:8px}
#sheet-b h3{margin:12px 0 0;font-family:var(--fc);font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
#sheet-b .lsub{margin-left:0}
#sheet-b .lopt+.lsub,#sheet-b .lopt+.lkeys{margin-left:24px}
.snote{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.lkeys{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--mute)}
.lkey{display:inline-flex;align-items:center;gap:5px}
.who{margin-top:8px}
.who-row{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.who-row .sw{margin-top:5px;flex:none}
.who-row small,.who small{display:block;color:var(--mute);font-size:12px}
.who-kv{margin:8px 0}
.who-wait,.who-none{margin:6px 0;font-size:12.5px;color:var(--mute)}
.ctx.who{min-width:210px;color:#1b221e}
.ctx.who small,.ctx.who .who-wait,.ctx.who .who-none{color:#5b6660}
.ctx.who dt{color:#5b6660}
.letter{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.letter>summary{cursor:pointer;font-weight:600;font-size:13.5px;padding:4px 0}
.fr{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 10px;border-radius:0 6px 6px 0}
.pin.my-ok{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 4px rgba(26,150,65,.75)}
.pin.my-asked{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 4px rgba(224,138,0,.75)}
@media (max-width:820px){
  :root{--barh:54px}
  #map{inset:0 0 var(--barh) 0}
  #swipe{bottom:var(--barh)} #swipe .side{top:10px}
  #lbar{top:auto;left:0;right:0;bottom:0;max-width:none;height:var(--barh);border-radius:0;border-width:1px 0 0;box-shadow:none}
  #lbar .lscroll{flex:1;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);padding-right:18px}
  .lb{min-width:52px;height:53px}
  #lb-big{display:flex}
  #addbar{top:10px}
  #banner{bottom:calc(var(--barh) + 30px)}
  .leaflet-bottom.leaflet-left{bottom:0}
  .brand{display:none} .top{padding-block:0} .tabs{margin-top:0}
  .tabs button{padding:12px 4px 9px;font-size:14.5px}
  #app.mapbig{grid-template-rows:minmax(0,1fr) 46px}
  .btn{padding:9px 12px} .btn.sm{padding:8px 11px;font-size:13px}
  .chip{padding:7px 11px;font-size:13px}
  input[type=search],input[type=text],input[type=url],select,textarea{font-size:16px}
  #scrim{background:rgba(0,0,0,.38)}
  #sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;max-height:82vh;max-height:82dvh;border-width:1px 0 0;border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.3);padding-bottom:env(safe-area-inset-bottom,0px)}
  #sheet>header{padding:12px 16px}
  #sheet-x{min-height:42px;min-width:92px;font-size:15px}
  #sheet-b{padding:2px 16px 22px}
  #sheet-b .lopt{font-size:15px;padding:4px 0} #sheet-b .lopt input{width:20px;height:20px;flex:none}
  #sheet-b .lopt small{font-size:12.5px}
}

/* ---- location dot, field log (November 15, 2026) ---- */
.gpsdot{width:18px;height:18px;border-radius:50%;background:#1f6feb;border:3px solid #fff;box-sizing:border-box;box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 0 0 5px rgba(31,111,235,.25)}
.gpsdot.stale{background:#8a9099;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
.notepin{width:16px;height:16px;border-radius:4px;background:#e11d74;border:2px solid #fff;box-sizing:border-box;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#recbar{left:calc(10px + env(safe-area-inset-left,0px));top:calc(74px + env(safe-area-inset-top,0px));padding:6px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:min(340px,calc(100% - 20px));border-color:#e11d74}
#recbar .recdot{flex:none;width:10px;height:10px;border-radius:50%;background:#e11d74;animation:recblink 1.4s infinite}
@keyframes recblink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#recbar .recdot{animation:none}}
#rec-t{font-size:12.5px}
#rec-form{display:flex;gap:6px;flex-basis:100%}
#rec-form input{flex:1;min-width:0}
.logitem b{font-size:15px}
.logitem details{margin-top:8px}
.logitem summary{cursor:pointer;font-size:13px;color:var(--mute)}
.lognotes{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.lognotes li{display:flex;gap:10px;font-size:13px}
.lognotes .mono{color:var(--mute);flex:none}
@media (max-width:820px){#recbar{top:10px;max-width:calc(100% - 20px);gap:6px} #addbar:not([hidden])~#recbar{top:66px} .tabs button{letter-spacing:.02em}}

</style>

<body>
<div id="app">
  <aside id="side">
    <header class="top pad">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Lost &amp; Hidden Atlas</h1>
          <p id="tagline">Upstate New York · Massachusetts</p>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" id="tab-list" data-view="list" aria-selected="true">Places</button>
        <button role="tab" id="tab-trip" data-view="trip" aria-selected="false">Trip<span class="n" id="trip-n">0</span></button>
        <button role="tab" id="tab-log" data-view="log" aria-selected="false">Log</button>
        <button role="tab" id="tab-guide" data-view="guide" aria-selected="false">Guide</button>
      </nav>
    </header>

    <section class="view" id="v-list" aria-labelledby="tab-list">
      <div class="tools pad">
        <div class="row">
          <label class="field"><span>Find a place</span>
            <input type="search" id="q" placeholder="Name, town, or a word like coaster" autocomplete="off"></label>
        </div>
        <div class="row">
          <label class="field"><span>Drive times from</span>
            <select id="home"></select></label>
          <button class="btn" id="add-place" title="Click the map to drop a new pin">+ Add a place</button>
        </div>
        <div class="presets" id="presets"></div>
        <details class="filters" id="filters">
          <summary><span>Filters</span><span id="fcount" class="mono"></span></summary>
          <div class="fbody" id="fbody"></div>
        </details>
      </div>
      <div class="pad">
        <div class="count" style="padding-block:8px 4px">
          <span id="count"></span>
          <label class="row" style="gap:5px;flex-wrap:nowrap"><span class="lbl">Sort</span>
            <select id="sort"><option value="time">Nearest first</option><option value="name">Name</option><option value="reg">Region</option><option value="left">Most left to see</option></select></label>
        </div>
      </div>
      <div class="pad" id="linechip" hidden style="padding-bottom:6px"></div>
      <ul id="list"></ul>
    </section>

    <section class="view" id="v-detail" hidden></section>
    <section class="view" id="v-trip" hidden aria-labelledby="tab-trip"></section>
    <section class="view" id="v-log" hidden aria-labelledby="tab-log"></section>
    <section class="view guide" id="v-guide" hidden aria-labelledby="tab-guide"></section>
  </aside>

  <main id="stage">
    <div id="map" role="application" aria-label="Map of sites"></div>
    <div id="readout" class="float mono" hidden></div>
    <div id="lbar" role="toolbar" aria-label="Map layers and tools"><div class="lscroll" id="lscroll"></div><div class="lfix" id="lfix"></div></div>
    <div id="swipe" hidden><span class="side l" id="swipe-l"></span><span class="side r" id="swipe-r"></span><div class="grip" role="slider" aria-label="Compare divider" tabindex="0">&lt;&gt;</div></div>
    <div id="addbar" class="float" hidden><span>Tap the map where the place is.</span><button class="btn sm" id="add-here" hidden>Use where I am</button><button class="btn sm" id="add-cancel">Cancel</button></div>
    <div id="recbar" class="float" hidden><span class="recdot" aria-hidden="true"></span><span id="rec-t" class="mono" aria-live="off"></span><button class="btn sm" id="rec-note" type="button">+ Note</button><button class="btn sm" id="rec-stop" type="button">Stop</button><form id="rec-form" hidden><input type="text" id="rec-text" placeholder="What is here?" autocomplete="off" aria-label="Note"><button class="btn sm pri" type="submit">Save</button></form></div>
    <div id="banner" class="float" hidden></div>
    <div id="scrim" hidden></div>
    <section id="sheet" hidden role="dialog" aria-labelledby="sheet-t">
      <header><h2 id="sheet-t">Map options</h2><button class="btn pri" id="sheet-x" type="button">Done</button></header>
      <div id="sheet-b"></div>
    </section>
  </main>
</div>

et just west of Lodge, opposite St. Peter's Church, rebuilt in stone between 1702 and 1735. Its stones went into street widening and church buildings. The 1886 tablet adds \"Gallows Hill to the South, Fort Burial Ground to the North.\"","look":"three markers, including one at the base of the clock in the State Street median at Eagle.","hook":"a fort under four lanes of traffic.","links":[["Hoxsie: Tablet No. 11","https://hoxsie.org/?p=4569"],["HMDB","https://www.hmdb.org/m.asp?m=5280"]],"dt":{"alb":[0,0.1],"sch":[29,18.4],"troy":[14,7.6],"sar":[46,31.6],"wor":[158,130.8]},"pl":["East Capitol Park","City Land","OA"],"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.644241,-73.765283,42.658614,-73.745741],"v":"335bf2"}},{"id":"fort-orange","name":"Fort Orange site","town":"Albany","reg":"alb","cat":"fort","st":"marker","lat":42.6447,"lon":-73.7503,"prec":"site","acc":"view","eff":"drive","tags":["forts"],"years":"1624–1676","conf":"mixed","story":"The Dutch West India Company fort of 1624 stood southeast of the State Street marker, by the river. Archaeologists excavated it around 1970–71 before the I-787 ramps closed over it; it is listed on the National Register as an archaeological site.","look":"the state marker on the plaza at Broadway and State; the ramps near the Dunn Memorial Bridge sit on the site.","accn":"The fort itself is under the I-787 ramps by the Dunn Memorial Bridge. The state marker stands on the plaza at Broadway and State, about 450 m north.","links":[["NYS markers list","https://en.wikipedia.org/wiki/List_of_New_York_State_Historic_Markers_in_Albany_County,_New_York"]],"pn":"Pinned at the documented site under the highway ramps, not at the marker.","dt":{"alb":[7,2.3],"sch":[32,20.8],"troy":[18,9.4],"sar":[52,36.1],"wor":[159,128.1]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.637513,-73.76007,42.651886,-73.74053],"v":"706c52"}},{"id":"albany-basin","name":"Albany Basin and the Pier","town":"Albany","reg":"alb","cat":"canal","st":"marker","lat":42.65329,"lon":-73.74487,"prec":"exact","acc":"public","eff":"walk","tags":["canal"],"years":"1825–1960s","conf":"verified","story":"From 1825 a long pier enclosed the riverfront, creating a basin for about 1,000 canal boats and 50 steamboats; a weigh lock stood just north. The basin was filled for I-787 and the Corning Preserve. The original Lock 1 was rediscovered in 2002 in an industrial lot in North Albany.","look":"the Urban Cultural Park marker downtown, and old cut stone along Erie Boulevard, which follows the canal bed.","links":[["Empire State Plaza: Erie Canal in Albany","https://empirestateplaza.ny.gov/erie-canal-albany"],["HMDB","https://www.hmdb.org/m.asp?m=227414"],["Hoxsie: Lumber District 1857","https://hoxsie.org/2012/11/08/albanys_lumber_district_1857/"]],"dt":{"alb":[4,1.4],"sch":[31,20.3],"troy":[16,8.4],"sar":[50,35.0],"wor":[160,132.7]},"pl":["Corning City Preserve","City Land","OA"],"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.646103,-73.754641,42.660476,-73.735099],"v":"0dc938"}},{"id":"maiden-lane-bridge","name":"Maiden Lane Bridge site","town":"Albany","reg":"alb","cat":"rail","st":"gone","lat":42.6503,"lon":-73.7468,"prec":"site","acc":"public","eff":"walk","tags":["stations"],"years":"1871–c.1969","conf":"verified","story":"A rail swing bridge crossed from the foot of Maiden Lane to East Albany, with extra spans over the Basin and past the Albany Yacht Club's island. It came out after the New York Central moved passenger service to Rensselaer in 1968.","look":"the alignment at about 42.6478, -73.7458; check the river walls for any surviving pier stubs.","accn":"Corning Preserve riverfront path; the Hudson River Way footbridge lands at the foot of Maiden Lane.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Maiden_Lane_Bridge"],["Hoxsie","https://hoxsie.org/2017/02/08/the-maiden-lane-bridge/"]],"dt":{"alb":[3,1.0],"sch":[29,19.8],"troy":[14,7.9],"sar":[48,34.6],"wor":[158,132.3]},"pl":["Corning City Preserve","City Land","OA"],"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.643113,-73.756571,42.657486,-73.737029],"v":"27a9ab"}},{"id":"bleecker-hall","name":"Harmanus Bleecker Hall site","town":"Albany","reg":"alb","cat":"civic","st":"gone","lat":42.6566,"lon":-73.76212,"prec":"exact","acc":"public","eff":"drive","years":"1889–1940","conf":"verified","story":"Opened October 9, 1889 with 1,985 seats, the largest theater in the Capital District. It became Proctor's Harmanus movie house around 1929 and burned in May 1940. The main Albany Public Library now stands on the site.","hook":"the region's biggest stage is under the library.","links":[["Cinema Treasures","https://www.cinematreasures.org/theaters/44003"],["Harmanus Bleecker Library","https://en.wikipedia.org/wiki/Harmanus_Bleecker_Library"]],"dt":{"alb":[2,0.5],"sch":[30,18.4],"troy":[15,8.0],"sar":[47,31.6],"wor":[159,131.2]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.649413,-73.771892,42.663786,-73.752348],"v":"9a52ee"}},{"id":"tweddle-hall","name":"Tweddle Hall and Ten Eyck Hotel corner","town":"Albany","reg":"alb","cat":"civic","st":"gone","lat":42.64987,"lon":-73.75274,"prec":"exact","acc":"public","eff":"drive","tags":["hotels"],"years":"1860–1912; hotel to c.1970","conf":"verified","story":"Tweddle Hall was Albany's leading concert hall for decades. It came down around 1912 to enlarge the Ten Eyck Hotel, which was itself razed around 1970 for a bank. Two layers of lost buildings on one corner, at about 42.6499, -73.7528.","links":[["Twain's Geography","https://twainsgeography.com/location/tweddle-hall-albany-ny"]],"dt":{"alb":[1,0.4],"sch":[30,19.9],"troy":[13,7.5],"sar":[47,31.6],"wor":[157,130.7]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.642683,-73.762511,42.657056,-73.742969],"v":"ab47c8"}},{"id":"wellington-annex","name":"Wellington Hotel Annex site","town":"Albany","reg":"alb","cat":"civic","st":"gone","lat":42.6503,"lon":-73.7551,"prec":"site","acc":"public","eff":"drive","years":"imploded 2014","conf":"verified","story":"The annex behind State Street's Wellington Row was imploded on August 23, 2014; the historic façades on State Street were kept. Good for a façade-versus-loss segment.","links":[["Wellington Row","https://en.wikipedia.org/wiki/Wellington_Row"]],"dt":{"alb":[1,0.4],"sch":[30,18.6],"troy":[14,7.7],"sar":[47,31.7],"wor":[158,130.9]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.643113,-73.764871,42.657486,-73.745329],"v":"6a4ec3"}},{"id":"delavan-house","name":"Delavan House site","town":"Albany","reg":"alb","cat":"hotel","st":"gone","lat":42.65148,"lon":-73.74951,"prec":"site","acc":"public","eff":"drive","tags":["hotels"],"years":"burned 1894","conf":"lead","story":"A big railroad-era hotel that burned in 1894. Union Station rose on the site around 1900; the station closed in 1968 and is now Kiernan Plaza. Confirm dates in Albany Institute photo files before filming.","dt":{"alb":[1,0.4],"sch":[29,19.0],"troy":[13,7.3],"sar":[46,31.5],"wor":[157,130.5]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.644293,-73.759281,42.658666,-73.739739],"v":"eadd70"}},{"id":"washington-park-burial","name":"State Street Burying Ground","name2":"Under Washington Park","town":"Albany","reg":"alb","cat":"burial","st":"gone","lat":42.658,"lon":-73.7712,"prec":"site","acc":"public","eff":"walk","tags":["cemeteries"],"years":"c.1800–1868","conf":"verified","story":"From about 1800 the city's main cemetery covered much of today's park. Burials were moved to Albany Rural Cemetery in the 1860s (a city list of removed graves was printed in 1866) and the park was rebuilt over it around 1870. Local historians think some remains were left behind; a Lutheran ground also sat on the State Street side at Willett.","look":"the lawns between Knox and Robin streets, State St to Hudson Ave. City archaeological monitoring still applies to digging here.","links":[["NYS Museum: burial in early Albany","https://exhibitions.nysm.nysed.gov/albany/dead.html"],["Troy Irish Genealogy Society","https://sites.rootsweb.com/~nytigs/StateStreetBurialGrounds/State_Street_Burial_Grounds_Intro.htm"],["NY1","https://ny1.com/nyc/queens/albany-archives/2017/05/26/albany-archives-washington-park-cemetery"]],"dt":{"alb":[3,1.0],"sch":[29,18.1],"troy":[15,8.2],"sar":[46,31.3],"wor":[158,131.5]},"pl":["Washington Park","City Land","OA"],"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.650813,-73.780972,42.665186,-73.761428],"v":"b2dcee"}},{"id":"almshouse","name":"Albany Almshouse and potter's field","town":"Albany","reg":"alb","cat":"burial","st":"gone","lat":42.65094,"lon":-73.78134,"prec":"site","acc":"view","eff":"drive","tags":["cemeteries"],"years":"1826–1926","conf":"verified","story":"The county almshouse ran here from 1826 to 1926, with a pauper cemetery. A 2002 dig for a medical research building expected about 200 graves and found roughly 1,200; they were studied by the State Museum and reburied at Albany Rural. The almshouse stood behind the WWI-era armory, diagonally across from Albany Med.","links":[["Daily Gazette via Cliff Lamere","https://genealogy.clifflamere.com/Aid/Cem/AlbAlmshouseCem.htm"],["NYS Museum","https://nysm.nysed.gov/node/8264"]],"dt":{"alb":[7,1.8],"sch":[32,17.5],"troy":[19,9.0],"sar":[50,32.1],"wor":[163,132.2]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.643753,-73.791111,42.658126,-73.771569],"v":"5251ac"}},{"id":"penitentiary","name":"Albany Penitentiary site","town":"Albany","reg":"alb","cat":"inst","st":"gone","lat":42.65074,"lon":-73.77194,"prec":"site","acc":"view","eff":"drive","years":"1848–1931","conf":"verified","story":"A 12-acre prison bounded by Myrtle Ave, Lark St, Leonard Place and South Knox St. It closed in 1931 and was razed in 1933, when wreckers found isolation \"dungeons.\" The Stratton VA Medical Center now covers the site; its mugshot ledgers are at the County Hall of Records on Tivoli Street.","links":[["Albany County records guide","https://albanycountyny.gov/home/showpublisheddocument/308/636982263347500000"],["Wikipedia","https://en.wikipedia.org/wiki/Albany_Penitentiary"]],"dt":{"alb":[6,1.8],"sch":[32,19.4],"troy":[19,8.8],"sar":[49,31.9],"wor":[161,131.8]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.643553,-73.781711,42.657926,-73.762169],"v":"86b0f9"}},{"id":"mona-terrace","name":"Mona Terrace caskets","town":"Albany","reg":"alb","cat":"burial","st":"gone","lat":42.64428,"lon":-73.77402,"prec":"site","acc":"public","eff":"drive","tags":["cemeteries"],"years":"found 2009","conf":"verified","story":"On September 29, 2009, road crews hit five wooden caskets. Officials suspected a Roman Catholic cemetery that had been moved around 1910, apparently not completely. Neighbors already knew of an \"old burial ground\" nearby.","links":[["Construction Equipment Guide (AP)","https://www.constructionequipmentguide.com/caskets-unearthed-during-work-on-ny-road-project/13469"],["HNN/WTEN","https://www.hnn.us/article/117687"]],"dt":{"alb":[4,1.5],"sch":[29,18.8],"troy":[17,9.2],"sar":[48,32.0],"wor":[158,131.2]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.637093,-73.78379,42.651466,-73.76425],"v":"29febf"}},{"id":"sheridan-hollow","name":"Sheridan Hollow and the Foxenkill","town":"Albany","reg":"alb","cat":"water","st":"gone","lat":42.6548,"lon":-73.757,"prec":"area","acc":"public","eff":"walk","years":"culverted c.1840","conf":"verified","story":"The Foxenkill was put in a culvert around 1840 and the ravine filled for workers' housing. Residents used outhouses and wells into the 1920s; Dinah Jackson, Albany's first known Black property owner, held lots here, and Tories were reputedly hanged and buried in the hollow. Digs for a state parking garage produced a State Museum exhibit.","links":[["NYS Museum exhibit","https://nysm.nysed.gov/node/8376"],["Wikipedia","https://en.wikipedia.org/wiki/Sheridan_Hollow,_Albany,_New_York"]],"dt":{"alb":[1,0.2],"sch":[30,18.4],"troy":[14,7.7],"sar":[47,31.6],"wor":[158,130.9]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.644019,-73.771657,42.665579,-73.742343],"v":"f7f982"}},{"id":"manor-house","name":"Van Rensselaer Manor House site","town":"Albany","reg":"alb","cat":"inst","st":"gone","lat":42.66289,"lon":-73.74365,"prec":"area","acc":"public","eff":"drive","years":"1765–1893","conf":"verified","story":"The patroons' 1765 manor house stood just off Broadway near Loudonville Road, beside the mouth of Patroon Creek. Hemmed in by railroads, it was dismantled in 1893; Marcus T. Reynolds rebuilt much of it as a fraternity house at Williams College, which tore it down in 1973. A hall from it is at the Metropolitan Museum.","look":"the Tivoli, Manor and Thacher street area near the Nipper building. A 1946 writer said the exact spot was already hard to find.","links":[["NYS Museum","https://exhibitions.nysm.nysed.gov/albany/na/vrmh.html"],["Hoxsie: Tablet No. 25","https://hoxsie.org/2022/10/12/albany-bicentennial-tablet-no-25-manor-house/"],["The missing manor","https://banilsson.blogspot.com/2020/03/the-maddening-mystery-of-missing-manor.html"]],"dt":{"alb":[3,1.2],"sch":[29,18.3],"troy":[13,7.4],"sar":[45,30.6],"wor":[157,130.6]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.652109,-73.758309,42.673669,-73.728991],"v":"673cb0"}},{"id":"lumber-district","name":"Albany Lumber District","town":"Albany","reg":"alb","cat":"industry","st":"traces","lat":42.669,"lon":-73.735,"prec":"area","acc":"public","eff":"drive","tags":["canal"],"years":"1850s–1900s","conf":"verified","story":"From North Ferry Street north about 1.5 miles, between the Erie Canal and the river, slips and lumber piles made Albany the country's top lumber market by value in the 1870s. The Irish neighborhood here was nicknamed \"Limerick.\" Erie Boulevard follows the canal bed; I-787 covers the slips.","look":"old cut stone blocks along Erie Blvd.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Albany_Lumber_District"],["Times Union 518 s","lat":42.68314,"lon":-73.77846,"prec":"area","acc":"view","eff":"drive","years":"1854–1964","conf":"verified","story":"The New York Central bought 250 acres here in 1854 and grew it to about 350. At the turn of the century over 6,000 people built and repaired locomotives and cars. Car shops closed in 1954, the site sold in 1955 and most buildings came down in 1964; stockyards and slaughterhouses lingered longer.","look":"the main line still in use; railfans say one shop building survives, so check before you go.","links":[["Wikipedia","https://en.wikipedia.org/wiki/West_Albany,_New_York"]],"dt":{"alb":[9,4.3],"sch":[24,15.2],"troy":[15,9.2],"sar":[43,29.7],"wor":[159,132.4]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.672359,-73.793124,42.693919,-73.763796],"v":"062094"}},{"id":"first-steam-train","name":"First steam train junction","town":"Albany","reg":"alb","cat":"rail","st":"marker","lat":42.6664,"lon":-73.79215,"prec":"exact","acc":"public","eff":"drive","tags":["inclines"],"years":"1831–1844","conf":"verified","story":"The Mohawk & Hudson's 1831 line began here, where it met the Great Western Turnpike, and ran 16 straight miles to Schenectady. Inclined planes were added at both ends; in 1844 the line moved north to Tivoli Hollow, abandoning this end.","look":"the 2021 Pomeroy marker, then trace the 1831 alignment on 1830s–50s maps.","links":[["Pomeroy Foundation","https://wgpfoundation.org/historic-markers/first-steam-train"],["Wikipedia","https://en.wikipedia.org/wiki/Albany_and_Schenectady_Railroad"]],"dt":{"alb":[6,2.1],"sch":[27,16.0],"troy":[18,9.3],"sar":[47,31.2],"wor":[162,132.6]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.659213,-73.801923,42.673586,-73.782377],"v":"7fff78"}},{"id":"dobler-brewery","name":"Dobler Brewery site","name2":"Albany's lost breweries","town":"Albany","reg":"alb","cat":"industry","st":"traces","lat":42.64825,"lon":-73.76525,"prec":"site","acc":"public","eff":"drive","years":"1865–1960","conf":"mixed ],"wor":[153,127.6]},"tm":{"y":1929,"q":"Coxsackie, NY 1929","sc":62500,"b":[42.463189,-73.806965,42.484749,-73.777735],"v":"0f9b91"}},{"id":"van-wies-point","name":"Van Wies Point light and dock","town":"Glenmont","reg":"albco","cat":"light","st":"gone","lat":42.58176,"lon":-73.75568,"prec":"site","acc":"view","eff":"drive","years":"c.1858–1930s","conf":"mixed","story":"William Welch kept the Van Wie's Point light from about 1858 until he died in 1910 at 93, the longest-serving keeper on the Hudson. A state marker notes the Van Wie dock, leased in 1835 to the Hudson River Steamboat Co. as an Albany terminal. Confirm what survives of the light station before filming.","links":[["Hudson River Maritime Museum","https://www.hrmm.org/history-blog/featured-artifact-lighthouse-keepers-manual-van-wies-point"],["Van Wie's Dock marker","https://www.stoppingpoints.com/ny/Albany/Van+Wie%27s+Dock.html"]],"dt":{"alb":[14,6.2],"sch":[35,22.5],"troy":[24,13.1],"sar":[57,39.8],"wor":[153,127.2]},"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.574573,-73.76544,42.588946,-73.74592],"v":"7f4a59"}},{"id":"one-monument-square","name":"One Monument Square","name2":"The City Hall pit","town":"Troy","reg":"troy","cat":"civic","st":"gone","lat":42.7316,"lon":-73.69243,"prec":"exact","acc":"public","eff":"drive","tags":["now","renewal"],"years":"1974–2011","conf":"verified","story":"Troy's 1974 City Hall on River Street was torn down in 2011, leaving a 1.2–1.5 acre waterfront hole. Four or more redevelopment plans have collapsed since. In February 2026 the mayor vowed to build, and in July the council moved to transfer the site to the Troy Local Development Corporation for a $50 million project.","hook":"15 years as Troy's biggest empty lot; check whether work has started.","links":[["WAMC, Feb 2026","https://www.wamc.org/news/2026-02-19/troy-mayor-carmella-mantello-vows-to-redevelop-1-monument-square"],["Spectrum, July 2026","https://spectrumlocalnews.com/nys/capital-region/news/2026/07/21/troy-council-to-consider-resolution-on-plan-to-redevelop-one-monument-square"]],"now":true,"dt":{"alb":[13,7.9],"sch":[29,15.9],"troy":[1,0.3],"sar":[39,28.6],"wor":[163,134.9]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.724413,-73.702214,42.738786,-73.682646],"v":"a89de8"}},{"id":"barker-park","name":"1876 City Hall on the burial ground","name2":"Barker Park","town":"Troy","reg":"troy","cat":"civic","st":"gone","lat":42.72979,"lon":-73.69036,"prec":"exact","acc":"public","eff":"drive","tags":["cemeteries"],"years":"1876–1938","conf":"verified","story":"Troy chose the old Third Street Burial Ground, donated land once held by the Vanderheydens, for its Victorian City Hall. It burned in a spectacular 1938 fire that also toppled the First Baptist spire next door. Barker Park and St. Anthony of Padua now occupy the site.","hook":"a city hall on a cemetery, now a pocket park.","links":[["Hoxsie: Yes, there was a City Hall","https://hoxsie.org/?p=170"],["Shorpy 1905 photo","https://www.shorpy.com/node/22164"],["A Troy Story","https://suzannespellen.substack.com/p/you-cant-find-city-hall-a-troy-story"]],"dt":{"alb":[14,7.9],"sch":[30,15.9],"troy":[1,0.2],"sar":[39,28.6],"wor":[164,135.0]},"pl":["Troy City Lands","City Land","OA"],"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.722603,-73.700143,42.736976,-73.680577],"v":"d265de"}},{"id":"troy-union-station","name":"Troy Union Station site","town":"Troy","reg":"troy","cat":"rail","st":"gone","lat":42.7316,"lon":-73.6866,"prec":"site","acc":"public","eff":"drive","tags":["stations"],"years":"c.1903–1958","conf":"verified","story":"A Beaux-Arts station by Reed & Stem filled the block east of Union Street, from Broadway to Fulton. At its peak it handled over 130 passenger trains a day for five railroads. It closed and was demolished in 1958; the site became parking.","look":"the track alignment through the block. Only CSX's Troy industrial track still enters the city.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Union_Station_(Troy,_New_York)"],["Nashua City Station collection","https://nashuacitystation.org/collection/item/9304007234/"],["Railroad.net","https://www.railroad.net/troy-and-schenectady-branch-t18715.html"]],"dt":{"alb":[14,7.8],"sch":[29,15.7],"troy":[2,0.6],"sar":[39,28.4],"wor":[163,134.9]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.724413,-73.696384,42.738786,-73.676816],"v":"24d63d"}},{"id":"great-fire-1862","name":"Great Fire of 1862 footprint","town":"Troy","reg":"troy","cat":"civic","st":"gone","lat":42.733,"lon":-73.6893,"prec":"area","acc":"public","eff":"walk","years":"May 10, 1862","conf":"verified","story":"Sparks from the wooden railroad bridge to Green Island started the May 10, 1862 fire that gutted central Troy. Lost: the Union House, Washington Hall and Fulton House hotels, Troy City Bank, Warren's Female Charity School and two factories. Gurley rebuilt its instrument works at once; that 1862 building still stands.","links":[["Hoxsie: Troy before and after the fire","https://hoxsie.org/?p=227"]],"dt":{"alb":[13,7.7],"sch":[29,15.7],"troy":[2,0.7],"sar":[39,28.5],"wor":[163,134.8]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.722219,-73.703976,42.743779,-73.674624],"v":"a36562"}},{"id":"burden-wheel","name":"Burden Upper Works and wheel pit","town":"Troy","reg":"troy","cat":"industry","st":"traces","lat":42.7044,"lon":-73.6958,"prec":"area","acc":"public","eff":"walk","tags":["stove","monitor"],"years":"1851–1890s","conf":"verified","story":"Henry Burden's 1851 wheel, 62 feet across and 22 feet wide with 36 buckets, was the most powerful vertical water wheel ever built and a likely inspiration for the Ferris wheel. Abandoned in the 1890s, it lost a support pier in 1914 and was hauled off as scrap. The 50-acre works is a National Register archaeological site.","look":"a brick conduit with iron bands at the end of the upper raceway, the wheel mural at Mill, Water and High streets and Burden Ave, and Burden Pond Preserve's 43 acres of trails above.","accn":"Burden Pond Preserve trails are public; the gorge is steep. The marker stands on High St (Route 378) at 42.70306, -73.69644.","links":[["Hoxsie","https://hoxsie.org/2013/05/22/what_burdens_works_looked_like/"],["HMDB","https://www.hmdb.org/m.asp?m=95642"],["Hudson Mohawk Gateway","https://hudsonmohawkgateway.org/the-burden-water-wheel-and-the-ferris-wheel"],["Burden Pond trails","https://www.adksports.com/2025-05-hiking"]],"pn":"Approximate: pinned in the Wynants Kill gorge between Burden Pond and Mill Street. The 1928 map shows works buildings just west.","dt":{"alb":[9,5.2],"sch":[32,21.0],"troy":[5,1.9],"sar":[43,31.1],"wor":[159,132.3]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.693619,-73.710469,42.715179,-73.681131],"v":"01a8a7"}},{"id":"bessemer-plant","name":"First Bessemer steel plant","town":"Troy","reg":"troy","cat":"industry","st":"gone","lat":42.703,"lon":-73.7005,"prec":"area","acc":"view","eff":"drive","tags":["monitor"],"years":"1865–1890s","conf":"verified","story":"Winslow, Griswold & Holley started an experimental Bessemer plant in Troy on February 16, 1865, the first in the U.S. Troy's Rensselaer and Albany iron works had already rolled the USS Monitor's armor plates and rivets. The riverfront became Troy Steel & Iron, then a 1924 coke plant, and is now a state remediation site off Water Street.","accn":"fenced brownfield; film from Burden Ave and the river trail.","links":[["Britannica: Holley","https://www.britannica.com/biography/Alexander-Lyman-Holley"],["NYS Library: Griswold papers","https://nysl.nysed.gov/node/2513"],["HMDB South Troy marker","https://www.hmdb.org/m.asp?m=315258"],["DEC site history","https://extapps.dec.ny.gov/data/DecDocs/442029/Report.HW.442029.2019-01-08.Remedial%20Investigation%20Area%203%20Appendix%20A%20part2%20of3.pdf"]],"dt":{"alb":[10,5.6],"sch":[34,21.4],"troy":[6,2.1],"sar":[44,31.5],"wor":[160,132.7]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b
