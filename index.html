://en.wikipedia.org/wiki/Poesten_Kill"],["Mt. Ida Cemetery tour","https://www.newyorkhistoryblog.com/2012/03/page/4"]],"pn":"Pin is at the falls and lower gorge, where the mill ruins are. The gorge and old raceway benches show clearly on LiDAR.","dt":{"alb":[16,7.7],"sch":[31,16.4],"troy":[4,1.3],"sar":[41,29.2],"wor":[166,134.8]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.713813,-73.688282,42.728186,-73.668718],"v":"f1e1c1"}},{"id":"prospect-park-pool","name":"Prospect Park and the Bintz pool","town":"Troy","reg":"troy","cat":"inst","st":"ruins","lat":42.722,"lon":-73.6837,"prec":"site","acc":"public","eff":"walk","tags":["amusements"],"years":"1902–; pool 1926–1994","conf":"verified","story":"Troy bought the Warren family's Mount Ida estate for $110,000 and opened it in 1902, designed by Garnet Douglass Baltimore, RPI's first Black graduate. The Warren mansion (a military museum) and Vail House (\"the Casino\") are gone. Its 1926 above-ground Bintz pool closed in 1994 and sits abandoned.","look":"Unconfirmed lead: the estate's \"Gingerbread\" gatehouse was moved to College Ave around 1904 and later demolished.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Prospect_Park_(Troy,_New_York)"],["All Abandoned","https://www.allabandoned.com/prospect-park-pool"]],"pn":"The oval above-ground pool is visible on the aerial at the south end of the park.","dt":{"alb":[17,7.8],"sch":[32,16.6],"troy":[5,1.4],"sar":[42,29.3],"wor":[167,134.9]},"pl":["Troy City Lands","City Land","OA"],"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.714813,-73.693482,42.729186,-73.673918],"v":"8a8a02"}},{"id":"mount-olympus","name":"Mount Olympus","town":"Troy","reg":"troy","cat":"inst","st":"traces","lat":42.7439,"lon":-73.68333,"prec":"site","acc":"public","eff":"drive","years":"Round House burned 1830","conf":"mixed","story":"A rocky bluff on the old road to Lansingburgh, crowned by a \"Round House\" that burned on the night of February 13, 1830. Geologists collected fossils here in the 1840s. USGS still marks a summit near the river; compare with 1850s maps to see what streets and rail lines removed.","links":[["Lansingburgh Historical Society","https://www.lansingburghhistoricalsociety.org/mount-olympus"]],"dt":{"alb":[14,8.7],"sch":[29,15.6],"troy":[4,1.3],"sar":[38,28.4],"wor":[164,135.8]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.736713,-73.693116,42.751086,-73.673544],"v":"d0a994"}},{"id":"rensselaer-park","name":"Rensselaer Park","town":"Lansingburgh","reg":"troy","cat":"amuse","st":"gone","lat":42.7662,"lon":-73.6722,"prec":"site","acc":"public","eff":"drive","tags":["trolleyparks","amusements"],"years":"1867–1924","conf":"verified","story":"A private pleasure ground from 1867 with a trotting track and a skating pond, where local militia staged a mock Monitor-versus-Merrimac battle in the 1870s. The Union baseball club played here in 1868, around 108th–110th streets and 8th–9th avenues. It later became an amusement park with a Figure 8 coaster; Knickerbocker Park took over the site in 1924.","accn":"Public streets around the Lansingburgh school campus and Knickerbacker Park, which cover the site.","links":[["Lansingburgh HS: Rensselaer Park","https://www.lansingburghhistoricalsociety.org/rensselaer-park"],["The pond","https://www.lansingburghhistoricalsociety.org/rensselaer-park-pond"],["RCDB","https://rcdb.com/10606.htm"],["Protoball","https://protoball.org/Rensselaer_Park"]],"pn":"The 1929 map shows open ground here at the east edge of the street grid, between 108th and 110th streets. Today it is the school campus and playing fields.","dt":{"alb":[20,10.8],"sch":[34,17.6],"troy":[9,3.3],"sar":[41,25.8],"wor":[170,137.8]},"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.759013,-73.681989,42.773386,-73.662411],"v":"623346"}},{"id":"troy-new-england","name":"Troy & New England trolley","town":"Averill Park","reg":"renss","cat":"rail","st":"traces","lat":42.63434,"lon":-73.55358,"prec":"area","acc":"public","eff":"drive","years":"1895–1925","conf":"verified","story":"A nine-mile electric line ran from Troy's Albia neighborhood up the Wynantskill valley to the Sand Lake resorts. A 2024 marker at the Arlington Hotel (once the Elkhorn) notes it was Stop 22. Trace the grade, stops and resort sites along Route 66 and the Wynantskill.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Troy_and_New_England_Railway"],["Pomeroy marker","https://www.wgpfoundation.org/historic-markers/arlington-hotel/"]],"dt":{"alb":[23,12.6],"sch":[45,28.6],"troy":[22,10.6],"sar":[59,38.5],"wor":[154,123.3]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.623559,-73.568233,42.645119,-73.538927],"v":"2bd5f0"}},{"id":"clintons-ditch","name":"Clinton's Ditch under Harmony Mills","town":"Cohoes","reg":"conf","cat":"canal","st":"ruins","lat":42.77941,"lon":-73.70339,"prec":"exact","acc":"public","eff":"drive","tags":["canal"],"years":"1825–1841","conf":"verified","story":"When the original 1825 canal was rerouted around 1841, its bed became power canals for the mills. Original Locks 37 and 38 now serve as foundations for Harmony Mills buildings, visible through periscope viewers at the Clinton's Ditch Interpretive Plaza on North Mohawk Street. Remnants of Lock 39 sit at the south end of the same park.","hook":"look through a periscope at an 1825 lock under a factory.","links":[["Spindle City canal brochure","https://www.spindlecity.net/Brochures/Erie%20Canal%20brochure%202023.pdf"],["HMDB: Lock 39","https://www.hmdb.org/m.asp?m=42224"]],"dt":{"alb":[18,10.2],"sch":[31,14.4],"troy":[11,4.4],"sar":[36,23.7],"wor":[168,137.2]},"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.772223,-73.713181,42.786596,-73.693599],"v":"b10a15"}},{"id":"cohoes-locks","name":"Enlarged Erie Locks 9–18","town":"Cohoes","reg":"conf","cat":"canal","st":"ruins","lat":42.78548,"lon":-73.71116,"prec":"site","acc":"public","eff":"walk","tags":["canal"],"years":"1837–1915","conf":"verified","story":"Cohoes held the canal's densest flight: ten double limestone locks, each lifting about 10 feet. Lock 10 was dismantled in the 1950s; Lock 11 survives behind a church, and 12, 16, 17 and 18 still show cut stone, towpath and prism. Lock 16 is behind Harmony Mill No. 1, near Vliet and Harmony streets.","accn":"The pin is the canal map marker on North Mohawk St. Locks sit along a 1.5-mile strip through backyards and small parks; use the lock-by-lock guide.","links":[["Lock-by-lock photos","https://eriecanal.org/Lock9-18.html"],["HMDB canal map","https://www.hmdb.org/m.asp?m=280744"]],"pn":"Pin is the canal map marker, not a lock. Lock 16 is behind Harmony Mill No. 1 near Vliet and Harmony streets (42.7792, -73.7053).","dt":{"alb":[19,10.8],"sch":[30,14.3],"troy":[12,5.0],"sar":[34,23.1],"wor":[169,137.8]},"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.778293,-73.720952,42.792666,-73.701368],"v":"27b34c"}},{"id":"mastodon-pit","name":"Cohoes Mastodon pit","town":"Cohoes","reg":"conf","cat":"industry","st":"marker","lat":42.78046,"lon":-73.7047,"prec":"exact","acc":"public","eff":"drive","years":"found 1866","conf":"verified","story":"Digging foundations for Mill No. 3, nicknamed the \"Mastodon Mill,\" uncovered a mastodon skeleton in a glacial pothole in 1866. It now stands in the State Museum. Pair a museum shot with the mill exterior and the old \"Juncta\" site, the 1823 junction of the Erie and Champlain canals.","links":[["Harmony Mills brochure","https://www.spindlecity.net/Brochures/Harmony%20Mills%20district%20brochure%202023.pdf"],["Hoxsie: power canals","https://hoxsie.org/?p=1258"]],"dt":{"alb":[18,10.3],"sch":[30,14.3],"troy":[11,4.5],"sar":[35,23.6],"wor":[168,137.3]},"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.773273,-73.714491,42.787646,-73.694909],"v":"31a015"}},{"id":"matton-shipyard","name":"Matton Shipyard ruins","town":"Cohoes","reg":"conf","cat":"industry","st":"ruins","lat":42.779,"lon":-73.6807,"prec":"site","acc":"ask","eff":"walk","years":"1916–1983","conf":"verified","story":"John E. Matton moved his yard here in 1916 and built barges, tugs and police boats until 1983. The state bought it in 1989; roofs fell and floods took buildings until it was listed on the National Register in 2009. The 1921 canal motorship Day Peckinpaugh is berthed here.","accn":"part of Peebles Island State Park; ask Parks about access to the yard itself.","links":[["Hudson River Maritime Museum","https://www.hrmm.org/history-blog/the-matton-shipyard"],["HMDB","https://www.hmdb.org/m.asp?m=48282"]],"pn":"Shipyard buildings and slips are visible on the aerial between Delaware Avenue and the river.","dt":{"alb":[19,10.8],"sch":[34,15.4],"troy":[11,4.0],"sar":[39,25.0],"wor":[169,137.9]},"pl":["Peebles Island State Park","State Park and Recreation","OA"],"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.771813,-73.690491,42.786186,-73.670909],"v":"d8bf75"}},{"id":"union-bridge","name":"Union Bridge piers","name2":"First bridge over the Hudson","town":"Waterford","reg":"conf","cat":"rail","st":"traces","lat":42.7894,"lon":-73.67565,"prec":"exact","acc":"public","eff":"drive","years":"1804–1909","conf":"verified","story":"Theodore Burr's 726-foot timber bridge to Lansingburgh went up in seven months in 1804, was roofed in 1814 and burned on July 10, 1909. The original stone piers are encased inside the concrete piers of today's Troy–Waterford Bridge; the toll sign and a timber model are at the Waterford Museum. Two later Cohoes–Lansingburgh bridges also burned, the last on March 4, 1920.","links":[["HMDB","https://www.hmdb.org/m.asp?m=68775"],["Daily Gazette","https://dailygazette.com/2013/09/04/waterford-bridge-get-landmark-designation/"],["Rensselaer County bridges","https://rensselaer.nygenweb.net/article1.htm"]],"dt":{"alb":[21,11.7],"sch":[34,18.2],"troy":[13,4.7],"sar":[36,24.3],"wor":[171,138.8]},"pl":["Memorial Park","City Land","OA"],"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.782213,-73.685443,42.796586,-73.665857],"v":"0d6c23"}},{"id":"waterford-fire-lots","name":"Waterford's 1841 fire lots","town":"Waterford","reg":"conf","cat":"civic","st":"gone","lat":42.79015,"lon":-73.67826,"prec":"area","acc":"public","eff":"drive","years":"burned 1841","conf":"verified","story":"The village's municipal parking lot covers the sites of two 19th-century hotels destroyed in the 1841 fire, with no known images of either. Town Hall replaced an 1873 building that burned in 1914. Use the village walking-tour brochure as a map.","hook":"the hotels nobody photographed.","links":[["Waterford walking tour","https://passageport.org/wp-content/uploads/2020/11/Water-fors-Walking-Tour-Brochure-2009.pdf"]],"dt":{"alb":[21,11.5],"sch":[34,18.1],"troy":[13,4.9],"sar":[36,24.2],"wor":[171,138.6]},"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.779369,-73.692949,42.800929,-73.663571],"v":"7ec80d"}},{"id":"waterford-side-cut","name":"\"The Crossroads\" side-cut locks","town":"Waterford","reg":"conf","cat":"canal","st":"ruins","lat":42.7889,"lon":-73.6816,"prec":"exact","acc":"public","eff":"walk","tags":["canal"],"years":"c.1860","conf":"verified","story":"Enlargement-era side-cut locks from about 1860 linked the canals to the Hudson here. Today they act as a spillway when Barge Canal Lock 2 operates; drained in winter, the old chambers show their stonework.","links":[["Lock 2 Park marker","https://www.historicalmarkerproject.com/markers/HMYE9_lock-2-park_Waterford-NY.html"]],"pn":"Three old lock chambers in a row are visible on the aerial, immediately south of Barge Canal Lock 2.","dt":{"alb":[21,11.5],"sch":[34,18.3],"troy":[14,5.7],"sar":[36,24.4],"wor":[171,138.5]},"pl":["Erie Canal","Other or Unknown State Land","OA"],"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.781713,-73.691393,42.796086,-73.671807],"v":"4bd0ae"}},{"id":"ford-green-island","name":"Ford Green Island plant site","town":"Green Island","reg":"conf","cat":"industry","st":"gone","lat":42.75839,"lon":-73.68816,"prec":"site","acc":"public","eff":"walk","years":"1923–1988","conf":"verified","story":"After camping here in 1919 with Edison, Firestone and Burroughs, Henry Ford built a hydro-powered plant that made radiators and heater cores, employing close to 1,000. It closed in 1988 and the factory was torn down in 2004; the hydroelectric station still runs. The four friends' carved initials became the plant cornerstone.","look":"Also here: River Park marks where the 1823 State Dam crossed to Troy.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Green_Island,_New_York"],["HMDB: Ford","https://www.hmdb.org/m.asp?m=256010"],["HMDB: Green Island","https://www.hmdb.org/m.asp?m=255785"],["Hoxsie","https://hoxsie.org/2018/05/15/mr-ford-builds-his-dream-hydro-plant/"]],"dt":{"alb":[15,9.1],"sch":[31,16.2],"troy":[7,2.6],"sar":[40,28.9],"wor":[165,136.2]},"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.751203,-73.697948,42.765576,-73.678372],"v":"ba80aa"}},{"id":"watervliet-side-cut","name":"Watervliet side-cut locks (buried)","town":"Watervliet","reg":"conf","cat":"canal","st":"marker","lat":42.732789,"lon":-73.701082,"prec":"exact","acc":"public","eff":"drive","tags":["canal"],"years":"1823–1920s","conf":"verified","story":"Troy merchants paid for an \"upper side cut\" at today's 23rd Street (1823) so boats could skip the Albany Basin; a lower side cut ran just south of the Arsenal. The lock remains were photographed in 1970 and reportedly filled in to preserve them. Photos show the abandoned canal through the Arsenal at 13th Street.","look":"the 1850 West Troy Weighlock building, which survives in Maplewood Historic Park, Colonie.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Watervliet_Side_Cut_Locks"],["HMDB: side cut","https://www.hmdb.org/m.asp?m=12214"],["HMDB: weighlock","https://www.hmdb.org/m.asp?m=40996"]],"dt":{"alb":[11,7.0],"sch":[28,14.9],"troy":[3,0.8],"sar":[37,27.7],"wor":[161,134.1]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.725602,-73.710866,42.739975,-73.691298],"v":"15f1e6"}},{"id":"al-tro-park","name":"Al-Tro Park","town":"Menands","reg":"albco","cat":"amuse","st":"marker","lat":42.68213,"lon":-73.71945,"prec":"site","acc":"public","eff":"walk","tags":["trolleyparks","amusements"],"years":"1906–1909; successor parks to 1921","conf":"verified","story":"Named for Albany and Troy, it sat on an island cut off by the Hudson and the Erie Canal, reached by trolley or steamboat. A fire that started in an ice cream booth swept it on September 14, 1913. A new marker stands in Menands.","look":"Dates conflict between sources: the trail marker gives Al-Tro as 1906–1909, followed on the same site by Maple Beach Park (1910–1912) and Midway Beach Park (1915–1921); another source has it opening as Al-Tro Island Park on Memorial Day 1907. Check which park the 1913 fire belongs to before you say it on camera.","accn":"No car access. The marker is on the Empire State Trail bike path; walk or bike in from the Fourth Street trailhead in Watervliet.","links":[["Spotlight / Daily Gazette","https://www.dailygazette.com/spotlightnews/towns/colonie/discover-menands-revisiting-the-historic-al-tro-park/article_c4ba942f-7ac2-5339-9cd6-a51aad86d0af.html"],["HMDB","https://www.hmdb.org/m.asp?m=307514"]],"th":[42.70979,-73.70655],"thn":"Fourth St trailhead, Watervliet","pn":"The 1928 map still shows the island here, cut off by the Erie Canal on the west. The pin is the trail marker.","dt":{"alb":[12,6.3],"sch":[32,16.5],"troy":[6,2.1],"sar":[41,29.2],"wor":[162,133.4]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.674943,-73.729226,42.689316,-73.709674],"v":"ce4442"}},{"id":"east-albany-yards","name":"East Albany freight yards","town":"Rensselaer","reg":"renss","cat":"rail","st":"gone","lat":42.6415,"lon":-73.7455,"prec":"area","acc":"public","eff":"drive","years":"burned 1861","conf":"mixed","story":"On July 5, 1861 fire destroyed the Albany & Boston Railroad's freight depots in East Albany, now Rensselaer, along with loaded canal boats; losses topped half a million dollars. The later New York Central yards here were mostly cleared for redevelopment. Compare 1880s Sanborn sheets with the riverfront today.","links":[["House Divided: Leslie's 1861 engraving","https://hd.housedivided.dickinson.edu/node/33094"]],"dt":{"alb":[3,1.1],"sch":[29,19.6],"troy":[14,8.3],"sar":[48,34.9],"wor":[158,132.1]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.630719,-73.760154,42.652279,-73.730846],"v":"67425b"}},{"id":"albany-hudson-trolley","name":"Albany & Hudson third-rail trolley","town":"Nassau","reg":"renss","cat":"rail","st":"traces","lat":42.53541,"lon":-73.60864,"prec":"exact","acc":"public","eff":"walk","years":"1899–1929","conf":"verified","story":"An electric line ran from Albany through Rensselaer and Columbia counties to Hudson, with a resort stop at Electric Park on Kinderhook Lake. A 1901 crash outside Greenbush killed at least seven. Its 36-mile bed is now the Albany–Hudson Electric Trail (AHET), so station sites and culverts are on a public trail.","accn":"The pin is one trail marker near Nassau; the whole 36-mile bed is the public Albany–Hudson Electric Trail.","links":[["HMDB: AHET","https://www.hmdb.org/m.asp?m=230279"],["Hoxsie: trolley tragedies","https://hoxsie.org/?p=1623"]],"dt":{"alb":[24,15.3],"sch":[46,31.2],"troy":[30,19.5],"sar":[64,44.2],"wor":[149,120.3]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.528223,-73.618393,42.542596,-73.598887],"v":"5b07f0"}},{"id":"vale-burial-ground","name":"African American burial ground, Vale Cemetery","town":"Schenectady","reg":"sch","cat":"burial","st":"marker","lat":42.80406,"lon":-73.9224,"prec":"site","acc":"public","eff":"walk","tags":["now","cemeteries"],"years":"moved 1863; survey 2026","conf":"verified","story":"Schenectady's Black community buried its dead on Hamilton Hill along Veeder Avenue until the ground was moved to Vale Cemetery beginning in 1863, with no surviving records. Ground-penetrating radar in July 2026 found 300 to 400 unmarked graves in Section F and an intact headstone from about 1829 buried just under the turf. The old Veeder Avenue ground was sold off for development.","look":"Section F at Vale, then walk Veeder Ave for the original site.","links":[["Daily Gazette, July 2026","https://www.dailygazette.com/news/education/african-american-burial-ground-discoveries/article_19b84474-0292-4f67-b488-d6dc39587f71.html"],["Vale Cemetery","https://valecemetery.org/african-american"],["HMDB","https://www.hmdb.org/m.asp?m=135164"]],"now":true,"dt":{"alb":[25,17.0],"sch":[5,1.6],"troy":[28,13.5],"sar":[40,23.3],"wor":[174,145.6]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.796873,-73.932195,42.811246,-73.912605],"v":"c491de"}},{"id":"stockade-churchyard","name":"Stockade's lost churchyard","town":"Schenectady","reg":"sch","cat":"burial","st":"gone","lat":42.81825,"lon":-73.94569,"prec":"area","acc":"public","eff":"walk","tags":["cemeteries"],"years":"moved 1859–1879","conf":"verified","story":"The First Reformed Church's burying ground near Green and Front streets was overgrown and \"unsanitary\" by the 1850s and was moved to Vale between 1859 and 1879. Pair it with the Vale story above: two whole cemeteries relocated within a generation.","links":[["HMDB: Vale founders","https://www.hmdb.org/m.asp?m=135164"]],"dt":{"alb":[27,18.5],"sch":[2,0.5],"troy":[31,14.8],"sar":[39,23.3],"wor":[176,147.1]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.807469,-73.960386,42.829029,-73.930994],"v":"73b5b8"}},{"id":"queens-fort","name":"Queen's Fort site","town":"Schenectady","reg":"sch","cat":"fort","st":"marker","lat":42.8183,"lon":-73.945772,"prec":"exact","acc":"public","eff":"drive","tags":["forts"],"years":"c.1705–1780s","conf":"verified","story":"After the 1690 massacre, a triple-stockade fort went up here around 1705, rebuilt in 1735 on a 10-foot stone wall: 100 feet square, with 20-foot blockhouses at the corners and six cannon. It was dismantled after the Revolution. The \"Lawrence the Indian\" statue marks its northeast blockhouse; the earlier Corlaer's Fort (1661–1690) stood a few hundred feet west.","links":[["HMDB: Site of Queen's Fort","https://www.hmdb.org/m.asp?m=32506"],["NYS Military Museum","https://museum.dmna.ny.gov/forts/queens"],["FortWiki","https://fortwiki.com/Fort_Schenectady"]],"dt":{"alb":[27,18.5],"sch":[2,0.5],"troy":[31,14.8],"sar":[39,23.3],"wor":[176,147.1]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.811113,-73.955569,42.825486,-73.935975],"v":"9e0528"}},{"id":"burr-bridge","name":"Burr's Mohawk bridge abutment","town":"Schenectady","reg":"sch","cat":"rail","st":"traces","lat":42.8186,"lon":-73.9495,"prec":"site","acc":"public","eff":"walk","years":"1808–1926","conf":"verified","story":"Theodore Burr's 997-foot wooden suspension bridge to Scotia opened in 1808; in 1857 its floor gave way under about 50 cattle. An iron bridge reused its piers from 1874, later carried trolleys, and served until 1926. Its abutment is still visible where Washington Avenue meets the river, aimed straight at Scotia's own Washington Avenue.","links":[["Hoxsie: the Washington Ave approach","https://hoxsie.org/?p=659"],["Hoxsie: the bridge that preceded it","https://hoxsie.org/?p=866"],["Vizettes: Burr Bridge","https://vizettes.com/kt/upstateny-history/historical/burr-bridge.htm"]],"pn":"Pin is where Washington Avenue meets the river bank. Not confirmed stone by stone on imagery.","dt":{"alb":[27,18.4],"sch":[2,0.7],"troy":[31,16.6],"sar":[40,23.5],"wor":[176,147.0]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.811413,-73.959297,42.825786,-73.939703],"v":"e39b4e"}},{"id":"erie-boulevard","name":"Erie Boulevard, the filled canal","town":"Schenectady","reg":"sch","cat":"canal","st":"gone","lat":42.81422,"lon":-73.9441,"prec":"site","acc":"public","eff":"drive","tags":["canal"],"years":"1825–1917","conf":"verified","story":"Schenectady's stretch of the canal closed in 1917 and was filled largely with furnace ash; Erie Boulevard opened with a 1924 Progress Exposition and was finished by 1926. Liberty Street had to be lowered after its canal bridge came out, and old Dock Street became the sidewalk. A grain elevator once stood at Pine and Jefferson; the first Proctor's theater, later the Erie, opened onto the towpath.","look":"the 2025 bicentennial plaque on Erie Blvd and the unusual width of the street.","links":[["Hoxsie: from canal to boulevard","https://hoxsie.org/?p=4103"],["Grems-Doolittle Library","https://gremsdoolittlelibrary.blogspot.com/2014/06/from-erie-canal-to-erie-boulevard.html"],["Metroplex","https://www.schenectadymetroplex.com/?p=9709"]],"dt":{"alb":[28,18.6],"sch":[2,0.6],"troy":[32,14.9],"sar":[40,23.5],"wor":[176,147.2]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.807033,-73.953897,42.821406,-73.934303],"v":"962014"}},{"id":"schenectady-union-station","name":"Union Station site","town":"Schenectady","reg":"sch","cat":"rail","st":"gone","lat":42.81552,"lon":-73.9423,"prec":"site","acc":"public","eff":"drive","tags":["stations"],"years":"1908–1971","conf":"verified","story":"The Beaux-Arts station closed in 1969. Penn Central sold it to the city for $20,000 in December 1970 and it was demolished in 1971 for a parking lot. A plain 1979 Amtrak station on the site was itself razed in 2017; the 2018 station borrows the old design.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Schenectady_station"],["Hoxsie","https://hoxsie.org/?p=2029"],["Vizettes station history","https://www.vizettes.com/kt/rr/schenectady-rr-station/index.htm"]],"dt":{"alb":[28,18.6],"sch":[1,0.3],"troy":[31,14.6],"sar":[39,23.1],"wor":[176,147.2]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.808333,-73.952097,42.822706,-73.932503],"v":"7cab64"}},{"id":"alco-shops","name":"ALCO shops, now Mohawk Harbor","town":"Schenectady","reg":"sch","cat":"industry","st":"gone","lat":42.82485,"lon":-73.93289,"prec":"site","acc":"public","eff":"walk","years":"1848–1969; razed 2014","conf":"verified","story":"Locomotives were built here from 1848 to January 1969. Building 62 (later GE's Building 332), finished in 1905 and nearly 1,000 feet long, carried \"AMERICAN LOCOMOTIVE\" in brick; Building 70 ran about 930 feet. Both fell in 2014 for Mohawk Harbor and Rivers Casino.","look":"ALCO Heritage Trail signs along the river. Unconfirmed lead: some ALCO-era buildings may survive east of Maxon Road and North Jay Street.","links":[["Daily Gazette","https://www.dailygazette.com/towns/schenectady/end-of-the-line-alco-site-demolition-to-make-way-for-redevelopment-with-photo-gallery/article_b4bf600e-32c1-59f2-bf8f-32af94bc88bd.html"],["HMDB","https://www.hmdb.org/m.asp?m=38348"],["Metroplex: heritage trail","https://www.schenectadymetroplex.com/?p=3888"]],"dt":{"alb":[30,19.4],"sch":[3,1.1],"troy":[32,14.8],"sar":[37,22.3],"wor":[178,148.0]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.817663,-73.942688,42.832036,-73.923092],"v":"1f1a32"}},{"id":"engine-hill","name":"\"Engine Hill\"","town":"Schenectady","reg":"sch","cat":"rail","st":"marker","lat":42.80064,"lon":-73.94839,"prec":"exact","acc":"public","eff":"drive","tags":["inclines"],"years":"1831–1840s","conf":"verified","story":"The 1831 railroad's western terminal stood on Crane Street, long called Engine Hill; a 1938 city marker sits at Crane and 3rd Ave (about 801 Crane St). A stationary engine hauled cars down the incline toward the city until the line was rerouted in the early 1840s.","links":[["HMDB","https://www.hmdb.org/m.asp?m=309143"],["Vizettes","https://www.vizettes.com/kt/rr/schenectady-rr-station/index.htm"]],"dt":{"alb":[27,17.8],"sch":[4,1.2],"troy":[31,15.4],"sar":[43,24.3],"wor":[175,146.4]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.793453,-73.958185,42.807826,-73.938595],"v":"00231b"}},{"id":"plaza-theatre","name":"Plaza Theatre site","name2":"Downtown's lost theaters and corners","town":"Schenectady","reg":"sch","cat":"civic","st":"gone","lat":42.81151,"lon":-73.93927,"prec":"site","acc":"public","eff":"drive","years":"1931–1964","conf":"verified","story":"John Eberson's atmospheric Plaza Theatre (617 State St) opened August 28, 1931 with about 2,400 seats and was razed in 1964; the lot sat empty for decades. The State Theater at State and Erie was leveled in the late 1970s for parking, as were the Ellis and Bucci buildings on that corner. The Strand (409–411 State) is gone too.","look":"Background: a fire in 1819 destroyed 169 buildings, which is why downtown dates from after that year.","links":[["Cinema Treasures: Plaza","https://www.cinematreasures.org/theaters/12154"],["Shovel Ready, ch. 7","https://mail.schenectadyhistory.org/schenectady/shovelready/07.html"],["Hoxsie","https://hoxsie.org/?p=2792"]],"dt":{"alb":[27,17.6],"sch":[1,0.4],"troy":[30,14.4],"sar":[40,23.2],"wor":[176,146.2]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.804323,-73.949066,42.818696,-73.929474],"v":"b66ba6"}},{"id":"brandywine-park","name":"Brandywine Park","town":"Schenectady","reg":"sch","cat":"amuse","st":"gone","lat":42.7963,"lon":-73.9248,"prec":"site","acc":"public","eff":"drive","tags":["trolleyparks","amusements"],"years":"1896–early 1920s","conf":"verified","story":"The Schenectady Railway opened Brandywine Park in 1896 at the city's then-edge. The city grew around it, and the company sold the grounds to St. Luke's Church in the early 1920s. Use 1900s maps to place the picnic grove and pavilions.","accn":"Public streets. The gate faced the corner of Albany and Elm streets; a school and parish buildings went up on the grounds from 1928.","links":[["Grems-Doolittle Library","https://gremsdoolittlelibrary.blogspot.com/2013/08/a-look-back-at-brandywine-park.html"]],"pn":"The 1930 map shows an open block here, southwest of Albany Street opposite Elm Street, which matches the Historical Society's description of the gate.","dt":{"alb":[26,17.0],"sch":[5,1.8],"troy":[28,13.7],"sar":[42,23.9],"wor":[174,145.6]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.789113,-73.934594,42.803486,-73.915006],"v":"f96cc4"}},{"id":"rexford-aqueduct","name":"Rexford Aqueduct ruins","town":"Niskayuna","reg":"mohawk","cat":"canal","st":"ruins","lat":42.8496,"lon":-73.888,"prec":"site","acc":"public","eff":"walk","tags":["canal"],"years":"1842–c.1918","conf":"verified","story":"The 1825 Upper Mohawk aqueduct was replaced in 1841–42 by a 1,160-foot stone aqueduct on 14 piers. Most of it came down around 1916–18 for the Barge Canal. Two arches survive on the Niskayuna bank and one on the Rexford bank; you can stand on them, and a county marker went up in 2025.","look":"Also here: old Erie Lock 21, used as a boat launch by the Schenectady Yacht Club, and remains of Lock 22.","links":[["HMDB: aqueduct ruins","https://www.hmdb.org/m.asp?m=271804"],["HMDB: 1842 aqueduct","https://www.hmdb.org/m.asp?m=37826"],["Eriecanal.org","https://eriecanal.org/Rexford.html"]],"pn":"Pin is on the south bank just east of the Route 146 bridge, where the two surviving arches stand; the county marker is 170 m south on the bike trail.","dt":{"alb":[33,20.9],"sch":[9,4.1],"troy":[30,15.0],"sar":[31,19.2],"wor":[182,149.5]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.842413,-73.897802,42.856786,-73.878198],"v":"1bde0c"}},{"id":"trolley-bridge-piers","name":"\"Longest trolley bridge in the world\" piers","town":"Niskayuna / Alplaus","reg":"mohawk","cat":"rail","st":"ruins","lat":42.85,"lon":-73.8994,"prec":"site","acc":"public","eff":"walk","tags":["trolleyparks"],"years":"1902–1942","conf":"verified","story":"Just upstream of the Route 146 bridge, the Schenectady Railway's 1,800-foot steel trestle stood on limestone piers. The center piers were removed for the barge channel; piers still line the south side, with three on each bank. North of the river the right-of-way survives as an embankment trail at Bruce Road in Alplaus.","look":"the Glenridge Road \"trolley tunnels\" farther north.","accn":"Seen from the Mohawk-Hudson bike trail and Aqueduct Park on the south bank. The bridge crossed about half a mile upstream of the Route 146 bridge; piers still stand near both banks.","links":[["Vizettes: trolley bridge ruins","https://www.vizettes.com/kt/ne-interurbans/srw/aqueduct-trolleybridge.htm"],["Retracing the right-of-way","https://vizettes.com/kt/ne-interurbans/srw/retracing-srw-row.htm"]],"pn":"Piers show on the leaf-off aerial in a line at about -73.8994, roughly half a mile upstream of the Route 146 bridge. The 1930 map shows the trolley crossing here.","dt":{"alb":[35,21.5],"sch":[9,3.7],"troy":[31,15.6],"sar":[32,20.0],"wor":[183,150.1]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.842813,-73.909202,42.857186,-73.889598],"v":"fa682b"}},{"id":"crescent-aqueduct","name":"Crescent Aqueduct abutments","town":"Halfmoon / Colonie","reg":"mohawk","cat":"canal","st":"traces","lat":42.82311,"lon":-73.73168,"prec":"area","acc":"public","eff":"walk","tags":["canal"],"years":"1842–c.1914","conf":"verified","story":"The Lower Mohawk aqueduct carried the canal across the river at Crescent; the 1842 version was the longest aqueduct in the state. It was dismantled around 1914 for the Barge Canal, leaving only cut-stone abutment fragments on both banks.","links":[["Wikipedia: Crescent Bridge","https://en.wikipedia.org/wiki/Crescent_Bridge"],["Eriecanal.org","https://eriecanal.org/Crescent.html"]],"pn":"Approximate: pinned at Crescent Park on the north bank by the Route 9 bridge. Abutment stones not located on imagery.","dt":{"alb":[23,13.0],"sch":[27,14.1],"troy":[17,10.4],"sar":[29,20.2],"wor":[174,141.0]},"pl":["Town Of Halfmoon Land","City Land","UK"],"tm":{"y":1929,"q":"Cohoes, NY 1929","sc":62500,"b":[42.812329,-73.746377,42.833889,-73.716983],"v":"8279e7"}},{"id":"luna-park","name":"Luna Park / Rexford Park","town":"Rexford","reg":"mohawk","cat":"amuse","st":"ruins","lat":42.8533,"lon":-73.8946,"prec":"site","acc":"ask","eff":"walk","tags":["trolleyparks","amusements"],"years":"1901–1933","conf":"verified","story":"Reached by a nickel trolley ride over the long bridge above, Rexford's park had a coaster, carousel and an early aerial swing ride. Wreckers began tearing it down on April 3, 1935, after a couple of years as a picnic grove. Concrete footings from the coaster and park buildings still sit in overgrown woods, according to Saratoga Today and the Clifton Park town historian; the bridge piers are the easy establishing shot.","look":"The park went by Luna Park (1906), Dolle's Park (1911), Palisades Park (1916) and Rexford Park. George Farrall's booklet \"The Amusement Park at Rexford\" (2003) and the Clifton Park library's Farrall Collection have the photographs.","accn":"Private parcels on the wooded bluff above Main Street. Ask first; Clifton Park's town historian knows the owners. Main Street and Bluff Road are public.","links":[["Saratoga Today","https://saratogatodaynewspaper.com/?p=27905"],["Wikipedia","https://en.wikipedia.org/wiki/Luna_Park,_Schenectady"]],"pn":"The 1930 USGS map shows a trolley spur leaving the main line north of the bridge and ending at this spot, right on the Schenectady–Saratoga county line. LiDAR shows rectangular platforms on the terrace about 100 m north (42.8543, -73.8945). Turn on the old-map overlay and the LiDAR layer to walk it before you go.","fr":"Field report, November 2026: rails are still in the brush and can be seen from the edge. A passer-by confirmed more remains further in. The brush was too thick to get through; he said it is easier in winter on snowshoes.","dt":{"alb":[35,21.5],"sch":[10,4.7],"troy":[31,18.5],"sar":[31,19.4],"wor":[183,150.1]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.846113,-73.904403,42.860486,-73.884797],"v":"5b828b"}},{"id":"forest-park","name":"Forest Park","town":"Ballston Lake","reg":"sar","cat":"amuse","st":"traces","lat":42.9128,"lon":-73.8708,"prec":"site","acc":"view","eff":"walk","tags":["trolleyparks","amusements"],"years":"1904–1927","conf":"verified","story":"The GE-owned Schenectady Railway built a 144-acre park at the south end of Ballston Lake with a beach, ball fields and bike tracks. The company sold the land to campers in 1927 and trolleys stopped in 1940. The Ballston Veterans Bike Path follows the trolley bed past the site.","look":"The inn and the dining hall survive as private homes, and one original outhouse still stands. A wooden causeway once crossed the swamp at the lake's south end, and you can still see its line. The county historians have run walking tours of the grounds.","accn":"The Ballston Veterans Bike Path (the old trolley bed) is public and has an interpretive sign. The shore lots are private camps and homes.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Forest_Park_(Ballston_Lake,_New_York)"],["Saratoga Today","https://saratogatodaynewspaper.com/history/item/17290-forest-park-amusement-park"]],"pn":"The 1930 map shows the trolley along the west shore with buildings between the track and the lake at the south end. The park covered 144 acres, so treat the pin as the middle of it.","dt":{"alb":[40,24.1],"sch":[19,9.0],"troy":[33,21.1],"sar":[25,15.8],"wor":[191,153.9]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.905613,-73.880612,42.919986,-73.860988],"v":"fcce3d"}},{"id":"lock-23","name":"Enlarged Double Lock 23","town":"Rotterdam","reg":"mohawk","cat":"canal","st":"ruins","lat":42.8218,"lon":-73.9872,"prec":"exact","acc":"public","eff":"walk","tags":["canal"],"years":"1841–1915","conf":"verified","story":"Built in 1841, it was the canal's busiest lock, passing about 47,000 vessels a season around 1880; one chamber was enlarged to take two boats lashed together. It sits overgrown beside the Mohawk-Hudson trail at Rice and Schermerhorn roads, about 3,000 feet from Barge Canal Lock 8.","links":[["Eriecanal.org","https://eriecanal.org/Lock23.html"],["HMDB","https://www.hmdb.org/m.asp?m=93716"],["Union College","https://muse.union.edu/newsarchives/2001/05/29/union-college-group-working-to-restore-historic-lock-on-erie-canal"]],"pn":"The lock chamber shows on LiDAR just south of where the trail crosses.","dt":{"alb":[29,20.1],"sch":[5,2.9],"troy":[33,18.3],"sar":[43,25.8],"wor":[177,148.7]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.814613,-73.996998,42.828986,-73.977402],"v":"30b93f"}},{"id":"plotter-kill-aqueduct","name":"Plotter Kill aqueduct arches","town":"Rotterdam Junction","reg":"mohawk","cat":"canal","st":"ruins","lat":42.84646,"lon":-74.01376,"prec":"site","acc":"public","eff":"walk","tags":["canal"],"years":"1840s","conf":"verified","story":"Stone arches that carried the canal over the Plotter Kill, known in canal days as Van Slyck's or the Flat Stone Creek aqueduct. A small, little-visited ruin near the trail.","links":[["HMDB","https://www.hmdb.org/m.asp?m=125976"]],"dt":{"alb":[34,23.7],"sch":[11,5.8],"troy":[39,21.3],"sar":[45,27.0],"wor":[183,152.3]},"tm":{"y":1931,"q":"Amsterdam, NY 1931","sc":62500,"b":[42.839273,-74.023562,42.853646,-74.003958],"v":"d6bfaa"}},{"id":"schenectady-army-depot","name":"Schenectady Army Depot","town":"Rotterdam","reg":"mohawk","cat":"fort","st":"standing","lat":42.7875,"lon":-73.976,"prec":"area","acc":"view","eff":"drive","years":"1918–1960s","conf":"verified","story":"Built in 1918, it supplied 55 CCC camps in the 1930s, then grew to about 4,000 workers shipping vehicles in WWII. From 1948 to 1949 it processed the war dead returning home. The Galesi Group bought it in 1969 and it is now Rotterdam Corporate Park; a former Army housing area where Jimmy Carter once lived has a marker.","links":[["NYS Military Museum","https://museum.dmna.ny.gov/forts/schenectady-service-force-depot"],["HMDB: Carter housing","https://www.hmdb.org/m.asp?m=6870"],["Grems-Doolittle: WWI photos","https://gremsdoolittlelibrary.blogspot.com/2017/11/photos-of-schenectadys-army-depot.html"]],"dt":{"alb":[27,16.9],"sch":[8,3.0],"troy":[34,16.8],"sar":[47,26.0],"wor":[176,145.5]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.776719,-73.990689,42.798279,-73.961311],"v":"3dbb3a"}},{"id":"scotia-naval-depot","name":"Scotia Naval Supply Depot","town":"Glenville","reg":"mohawk","cat":"fort","st":"traces","lat":42.84355,"lon":-73.99186,"prec":"site","acc":"view","eff":"drive","years":"1942–1971","conf":"verified","story":"A 310-acre Navy depot near Thruway Exit 26 that employed over 2,000 people supplying the Atlantic fleet. Buildings were razed around 2012 and the federal government took on soil cleanup. Look for surviving rail spurs and warehouse slabs in the business park that replaced it.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Scotia_Naval_Supply_Depot"],["NYS Military Museum","https://museum.dmna.ny.gov/forts/scotia-naval-supply-depot"]],"dt":{"alb":[36,21.3],"sch":[11,3.7],"troy":[40,19.5],"sar":[45,22.5],"wor":[184,149.9]},"tm":{"y":1930,"q":"Schenectady, NY 1930","sc":62500,"b":[42.836363,-74.001661,42.850736,-73.982059],"v":"9c048d"}},{"id":"schoharie-crossing","name":"Schoharie Aqueduct and lost Fort Hunter","town":"Fort Hunter","reg":"mohawk","cat":"canal","st":"ruins","lat":42.9394,"lon":-74.2866,"prec":"exact","acc":"public","eff":"walk","tags":["canal","forts"],"years":"1841 aqueduct; fort 1712","conf":"verified","story":"The 1841 Schoharie Aqueduct had 14 arches; 9 remain, and the site keeps the only two surviving locks of the original 1825 canal. Fort Hunter (1712) and Queen Anne's Chapel stood at the Mohawk village of Tiononderoge; the canal destroyed the chapel in the 1820s. Queen Anne's Parsonage is the fort's only surviving building.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Schoharie_Crossing_State_Historic_Site"],["HMDB: the fort by the village","https://www.hmdb.org/m.asp?m=88534"],["Schenectady Digital History Archive","https://mail.schenectadyhistory.org/resources/mvgw/history/117.html"]],"pn":"The surviving arches are visible on the aerial crossing Schoharie Creek at this point.","dt":{"alb":[51,38.6],"sch":[32,22.1],"troy":[58,41.5],"sar":[55,32.3],"wor":[200,167.1]},"tm":{"y":1902,"q":"Fonda, NY 1902","sc":62500,"b":[42.932213,-74.296417,42.946586,-74.276783],"v":"9af63c"}},{"id":"amsterdam-main-street","name":"Amsterdam's vanished Main Street","town":"Amsterdam","reg":"mohawk","cat":"civic","st":"gone","lat":42.93602,"lon":-74.19057,"prec":"site","acc":"public","eff":"drive","tags":["renewal"],"years":"razed 1960s–80s","conf":"verified","story":"Urban renewal from the 1960s to the 1980s razed about 400 buildings and dropped a mall across East Main Street, cutting downtown in two. Route 5 now curves over the site of St. Mary's Institute near East Main and Schuyler Street. Good \"drive through what was there\" material with 1950s photos.","links":[["Daily Gazette","https://dailygazette.com/article/2018/05/26/amsterdam-taking-steps-to-move-train-station"],["Bob Cudmore: downtown memories","https://mohawkvalleyweb.com/index.php?id=1796"]],"dt":{"alb":[46,34.9],"sch":[27,18.4],"troy":[53,37.8],"sar":[46,26.7],"wor":[195,163.4]}},{"id":"scott-ice-house","name":"R. & W. Scott ice house ruins","town":"Stuyvesant","reg":"hud","cat":"industry","st":"ruins","lat":42.3577,"lon":-73.7888,"prec":"exact","acc":"public","eff":"walk","years":"1885–1934","conf":"verified","story":"Built in 1885 with four elevators hauling ice from the river, it was the largest ice house on the Hudson. It later grew mushrooms and burned in 1934. A tall brick powerhouse and foundations remain on a 0.4-mile DEC loop at the end of Ice House Road, off Route 9J.","look":"Also here: the Newton Hook–Coxsackie ferry ran from 1820 to 1938, and the 1902–03 Cary brickyard left building ruins just south on 9J.","accn":"DEC land at Nutten Hook. Park at the end of Ice House Road, off Route 9J; 0.4-mile loop.","links":[["HMDB","https://www.hmdb.org/m.asp?m=244912"],["HMDB: ice's rise and fall","https://www.hmdb.org/m.asp?m=244953"],["Wikipedia","https://en.wikipedia.org/wiki/R._and_W._Scott_Ice_Company_Powerhouse_and_Ice_House_Site"],["Cary Brickyard","https://upstateearth.blogspot.com/2009/03/cary-brickyard-at-newton-hook.html"]],"pn":"The ice house's big rectangular platform shows on LiDAR at the river's edge, matching the marker location.","dt":{"alb":[37,21.8],"sch":[63,40.3],"troy":[48,28.9],"sar":[82,55.6],"wor":[161,124.0]},"pl":["Nutten Hook State Tidal Wetland","State Department of Conservation","OA"],"tm":{"y":1929,"q":"Coxsackie, NY 1929","sc":62500,"b":[42.350513,-73.798525,42.364886,-73.779075],"v":"40159c"}},{"id":"empire-brickyard","name":"Empire Brickyard and company town","town":"Stockport","reg":"hud","cat":"industry","st":"ruins","lat":42.3382,"lon":-73.7738,"prec":"site","acc":"public","eff":"hike","years":"1880s–1930s","conf":"verified","story":"Jerome Walsh's yard between Gays Point and Little Nutten Hook grew a settlement called Walshville, renamed Empire, with a post office and reportedly 700 families. It closed before 1940 when the clay ran out. Six permanent kiln walls with firing arches survive, possibly the only such kiln remnants outside an intact Hudson Valley brickyard, plus bulkhead and rail-spur piers.","accn":"DEC Charles Flood Wildlife Management Area. No marked route to the kiln walls. The 1929 map overlay shows the long kiln shed on the east shore; match it against the LiDAR layer before you go.","links":[["Hudson Valley Ruins","https://www.hudsonvalleyruins.org/yasinsac/columbia/empire.html"],["Gossips of Rivertown","https://gossipsofrivertown.blogspot.com/2019/01/columbia-countys-sleeping-dragon-part-iv.html"]],"pn":"The 1929 USGS map draws a long kiln shed on the east shore here, between Little Nutten Hook and Gays Point. Not yet matched to a field photo.","dt":{"alb":[38,22.9],"sch":[64,41.4],"troy":[48,32.2],"sar":[82,56.9],"wor":[158,123.4]},"pl":["Charles Flood Wma At The Empire Brickyard","State Department of Conservation","OA"],"tm":{"y":1929,"q":"Coxsackie, NY 1929","sc":62500,"b":[42.331013,-73.783522,42.345386,-73.764078],"v":"358799"}},{"id":"coxsackie-light","name":"Coxsackie Light site","town":"Coxsackie","reg":"hud","cat":"light","st":"traces","lat":42.375,"lon":-73.79,"prec":"area","acc":"boat","eff":"boat","years":"1830–1940","conf":"verified","story":"A light stood on the north tip of the island from 1830; the last brick tower and keeper's house went up in 1868. It was razed in 1940. Look for the stone crib and riprap that protected the station, at about 42°22.5′ N, 73°47.4′ W.","links":[["Lighthouse Friends","https://www.lighthousefriends.com/light.asp?ID=1842"],["U.S. Coast Guard","https://www.history.uscg.mil/Browse-by-Topic/Assets/Land/All/Article/1912844/coxsackie-lighthouse/"]],"pn":"Pinned at the Coast Guard's rounded position (42°22.5′ N, 73°47.4′ W), which is only good to a few hundred metres. The station stood at the north tip of Rattlesnake Island.","dt":{"alb":[34,20.5],"sch":[60,39.0],"troy":[46,27.6],"sar":[79,54.3],"wor":[160,123.6]},"pl":["Nutten Hook State Tidal Wetland","State Department of Conservation","OA"],"tm":{"y":1929,"q":"Coxsackie, NY 1929","sc":62500,"b":[42.367813,-73.799728,42.382186,-73.780272],"v":"347066"}},{"id":"hudson-athens-light","name":"Hudson–Athens Lighthouse","town":"Hudson","reg":"hud","cat":"light","st":"standing","lat":42.25203,"lon":-73.8086,"prec":"exact","acc":"boat","eff":"boat","tags":["now"],"years":"1874","conf":"verified","story":"One of the survivors, but its wooden pilings are rotting and the building is shifting. It made the National Trust's endangered list in 2024, and in February 2026 the Trust reported damage worse than expected. Film it while it stands; tours run from Hudson.","accn":"Mid-river. View from Hudson's Henry Hudson Riverfront Park or the Athens waterfront; boat tours run from Hudson in season.","links":[["National Trust, Feb 2026","https://savingplaces.org/americas-most- west side, including West Strand Row, survived.","look":"Source material: Gene Dauner's slides, used in the film \"Lost Rondout.\"","links":[["Cooper Union screening notes","https://cooper.edu/events-and-exhibitions/events/lost-rondout-story-urban-removal"],["Friends of Historic Kingston tour","https://www.fohk.org/wp-content/uploads/2016/07/RondoutWT2016wMAP.pdf"]],"dt":{"alb":[73,57.5],"sch":[91,71.5],"troy":[83,64.4],"sar":[114,90.2],"wor":[203,153.6]},"tm":{"y":1934,"q":"Rhinebeck, NY 1934","sc":48000,"b":[41.911313,-73.992458,41.925686,-73.973142],"v":"9efa6a"}},{"id":"prospect-park-hotel","name":"Prospect Park Hotel site","town":"Catskill","reg":"hud","cat":"hotel","st":"gone","lat":42.21759,"lon":-73.85945,"prec":"area","acc":"public","eff":"drive","tags":["hotels"],"years":"burned 1914","conf":"lead","story":"A large hotel overlooked the Hudson at Catskill Point; a 1915 county history says it burned in 1914, and an 1851 fire had already taken the Irving House and two churches downtown. Confirm the site and dates with the Greene County Historical Society before filming.","links":[["Dear Old Greene County (1915)","https://ldsgenealogy.com/NY/books/Dear-old-Greene-County-embracing-facts-and-figures-Portraits-and-sketches-of-leading-men-part-11.htm"]],"dt":{"alb":[46,34.7],"sch":[64,48.7],"troy":[57,41.6],"sar":[87,67.4],"wor":[168,129.6]},"tm":{"y":1934,"q":"Catskill, NY 1934","sc":62500,"b":[42.206809,-73.874006,42.228369,-73.844894],"v":"280d4e"}},{"id":"hotel-kaaterskill","name":"Hotel Kaaterskill site","town":"Haines Falls","reg":"cat","cat":"hotel","st":"ruins","lat":42.1898,"lon":-74.0493,"prec":"site","acc":"public","eff":"hike","tags":["hotels"],"years":"1881–1924","conf":"verified","story":"George Harding built it after the Catskill Mountain House refused his daughter's special diet; it was billed as the world's largest mountain hotel, and President Arthur stayed a week in 1884. A kitchen fire on September 8, 1924 burned it overnight, visible for miles ff":"hike","tags":["inclines"],"years":"1892–1918","conf":"verified","story":"A cable funicular lifted cars of 75 to 100 passengers about 1,600 feet up the escarpment in roughly 10 minutes, from Otis Junction near Palenville to the Mountain House. It closed in 1918 and was sold for scrap; its coaches went to Chattanooga's Lookout Mountain incline. The scar is still visible, with a section of concrete trestle in the woods.","accn":"Steep, unmaintained route on state land; hikers start near Bogart Road north of Palenville. The top is at the Mountain House site.","links":[["Scenic Hudson","https://www.scenichudson.org/viewfinder/the-mountainside-ride-that-opened-up-the-catskills/"],["Scientific American, 1895","https://www.catskillarchive.com/rrextra/otissa.Html"],["Trestle remains","https://rc-pedalpoint.blogspot.com/2019/06/the-otis-incline-railway-part-one.html"]],"pn":"The 1903 map draws the incline as a straight line from Otis Junction to the Mountain House; the pin sits on the lower grade.","dt":{"alb":[67,44.1],"sch":[84,58.1],"troy":[77,51.0],"sar":[107,76.8],"wor":[189,140.7]},"tm":{"y":1903,"q":"Kaaterskill, NY 1903","sc":62500,"b":[42.185613,-74.0312,42.199986,-74.0118],"v":"b6c925"}},{"id":"grand-hotel","name":"Grand Hotel site","town":"Highmount","reg":"cat","cat":"hotel","st":"ruins","lat":42.15133,"lon":-74.48917,"prec":"site","acc":"ask","eff":"drive","tags":["hotels"],"years":"1881–1966","conf":"verified","story":"Built by the Ulster & Delaware Railroad on Monka Hill, its 418 rooms looked down the Big Indian valley to Slide Mountain. It closed in 1966 and later burned. Original stone walls, paths and the grand front staircase survive on the property at 111 Club House Drive; the railroad's Grand Hotel station and turntable site sit below.","accn":"Private property at 111 Club House Drive. Ask the owner before going past the road.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Grand_Hotel_(Highmount,_New_York)"],["Catskill Archive","https://catskillarchive.com/grand"],["Grand Hotel station","https://en.wikipedia.org/wiki/Grand_Hotel_station"]],"pn":"The 1903 map draws the long hotel building across this spot.","dt":{"alb":[111,80.2],"sch":[120,77.7],"troy":[121,87.1],"sar":[152,112.8],"wor":[239,173.7]},"tm":{"y":1903,"q":"Phoenicia, NY 1903","sc":62500,"b":[42.144143,-74.498864,42.158516,-74.479476],"v":"d9c556"}},{"id":"tremper-house","name":"Tremper House site","town":"Phoenicia","reg":"cat","cat":"hotel","st":"traces","lat":42.0802,"lon":-74.3082,"prec":"area","acc":"view","eff":"drive","tags":["hotels"],"years":"1879–1908","conf":"verified","story":"Jacob Tremper's railroad resort on the slopes of Mount Tremper was dedicated by Henry Ward Beecher, and Oscar Wilde lectured there in 1882. After a fight over using it for tuberculosis patients, it sat empty and burned in 1908. Look for the terrace and drive on the hillside above the Esopus.","links":[["Wikipedia: Mount Tremper","https://en.wikipedia.org/wiki/Mount_Tremper"]],"pn":"Approximate: pinned near the Phoenicia railroad station. The 1903 map does not label the hotel.","dt":{"alb":[92,66.9],"sch":[110,80.9],"troy":[102,73.8],"sar":[133,99.5],"wor":[221,161.0]},"tm":{"y":1903,"q":"Phoenicia, NY 1903","sc":62500,"b":[42.069419,-74.322724,42.090979,-74.293676],"v":"a1a18c"}},{"id":"overlook-mountain-house","name":"Overlook Mountain House ruins","town":"Woodstock","reg":"cat","cat":"hotel","st":"ruins","lat":42.0845,"lon":-74.0997,"prec":"exact","acc":"public","eff":"hike","tags":["hotels"],"years":"1871; ruin 1920s","conf":"verified","story":"The first hotel (1871) burned in 1875; its successor hosted the secret 1921 founding of the Communist Party of America and burned on October 31, 1923. Morris Newgold's concrete replacement was never finished and went to the state in 1940. Well known, but the communist-meeting angle rarely makes videos.","accn":"State land. 2 miles and about 1,200 ft of climb up the old carriage road from the Meads Mountain Road lot y.nps.gov/NRHP/GetAsset/NHLS/87000904_text"]],"dt":{"alb":[47,31.7],"sch":[40,21.5],"troy":[40,28.6],"sar":[1,0.3],"wor":[197,161.4]},"tm":{"y":1934,"q":"Saratoga Springs, NY 1934","sc":24000,"b":[43.072113,-73.794939,43.086486,-73.775261],"v":"e70440"}},{"id":"hotel-balmoral","name":"Hotel Balmoral and its railroad","town":"Wilton","reg":"sar","cat":"hotel","st":"traces","lat":43.2012,"lon":-73.7453,"prec":"site","acc":"public","eff":"walk","tags":["hotels"],"years":"1884–1897","conf":"verified","story":"Joseph Drexel's narrow-gauge line climbed 10.5 miles from Saratoga in 1882, and in 1883 it tested Leo Daft's electric locomotive, the Ampère. His Hotel Balmoral opened beside the cottage where Ulysses S. Grant died in 1885; it burned in December 1897 and the railroad was dismantled soon after. The site sat inside a sanatorium, then a state prison, until 4 acres including the hotel site went to Grant Cottage in 2022.","accn":"Grant Cottage State Historic Site; grounds and house open seasonally. The road passes the former prison gate.","links":[["Grant Cottage","https://www.grantcottage.org/the-cottage-and-its-site"],["Wikipedia: the railroad","https://en.wikipedia.org/wiki/Saratoga,_Mount_McGregor_and_Lake_George_Railroad"],["Emerging Civil War","https://emergingcivilwar.com/2022/05/07/saving-history-saturday-grant-cottage-acquires-additional-land"],["HMDB: the rail line","https://www.hmdb.org/m.asp?m=229502"]],"dt":{"alb":[62,42.6],"sch":[56,34.5],"troy":[55,39.5],"sar":[20,9.5],"wor":[213,172.3]},"pl":["Grant Cottage State Historic Site","State Park and Recreation","OA"],"tm":{"y":1935,"q":"Gansevoort, NY 1935","sc":24000,"b":[43.194013,-73.755159,43.208386,-73.735441],"v":"5eb8cc"}},{"id":"sans-souci","name":"Sans Souci Hotel block","town":"Ballston Spa","reg":"sar","cat":"hotel","st":"gone","lat":43.00262,"lon":-73.8488,"prec":"site","acc":"public","eff":"drive","tags":["hotels"],"years":"1803–1888","conf":"verified","story":"Built by Nicholas Low in 1803, the Sans Souci was then the largest hotel in the country and filled the block bounded by Front Street, Milton Avenue, Washington Street and Spring Street. It later housed a law school and a ladies' seminary and was torn down in the winter of 1887–88. Down the street, the Eagle Hotel burned on July 8, 1932; the post office stands on its site.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Sans_Souci_Hotel_(Ballston_Spa)"],["NY Almanack (repost)","https://rihs.us/?p=31378"],["Brookside Museum: Eagle Hotel","https://brooksidemuseum.org/2014/07/eagle-hotel-fire/"]],"dt":{"alb":[43,28.0],"sch":[28,15.0],"troy":[36,24.9],"sar":[13,6.7],"wor":[193,157.7]},"tm":{"y":1934,"q":"Saratoga Springs, NY 1934","sc":24000,"b":[42.995433,-73.858627,43.009806,-73.838973],"v":"b92c56"}},{"id":"kaydeross-park","name":"Kaydeross Park","town":"Saratoga Springs","reg":"sar","cat":"amuse","st":"gone","lat":43.0468,"lon":-73.7325,"prec":"site","acc":"view","eff":"drive","tags":["trolleyparks","amusements"],"years":"1900–1987","conf":"verified","story":"A trolley park reached by streetcar until 1925, it ran as an amusement park until August 1987, when its 40 acres were sold for 349 luxury housing units. Its 1910 carousel now spins in Congress Park, and Kaydeross Park Road is about the only other trace.","accn":"Private housing development on the lake. Kaydeross Park Road is public; the 1910 carousel runs in Congress Park in season.","links":[["Vizettes","https://www.vizettes.com/kt/ne-interurbans/ser/kaydeross-park.htm"],["1987 newspaper account","https://freepages.rootsweb.com/~howardlake/history/amusement8/kayderossny.html"]],"pn":"The mid-century USGS map labels \"Kaydeross Park\" at the lakeshore here; the 1934 map shows buildings at the same spot.","dt":{"alb":[50,34.1],"sch":[44,26.1],"troy":[44,31.1],"sar":[12,5.0],"wor":[201,163.9]},"tm":{"y":1934,"q":"Quaker Springs, NY 1934","sc":24000,"b":[43.039613,-73.742334,43.053986,-73.722666],"v":"53a97e"}},{"id":"courtland-street","name":"Courtland Street burial ground","town":"Lake George","reg":"adk","cat":"burial","st":"gone","lat":43.41822,"lon":-73.71594,"prec":"site","acc":"public","eff":"drive","tags":["cemeteries"],"years":"1776; found 2019","conf":"verified","story":"On February 7, 2019 a crew digging a basement a block off Canada Street cut into an unmarked cemetery. State Museum researchers identified at least 44 people, patients of the 1776 Continental Army smallpox hospital at Fort George, where an estimated thousand died that year. They were reburied in Lake George Battlefield Park at the \"Repose of the Fallen\" memorial, dedicated in 2026.","hook":"walk from the house lot on Courtland Street to the new memorial.","links":[["Lake George Examiner: dedication","https://www.lakegeorgeexaminer.com/repose-of-the-fallen-memorial-dedicated-at-reinterment-ceremony/"],["Adirondack Explorer","https://www.adirondackexplorer.org/?p=306369"],["Saratoga Living","https://saratogaliving.com/lake-george-to-honor-its-revolutionary-roots/"]],"now":true,"dt":{"alb":[74,56.8],"sch":[68,48.8],"troy":[68,53.7],"sar":[33,25.9],"wor":[225,186.5]},"tm":{"y":1897,"q":"Glens Falls, NY 1897","sc":62500,"b":[43.411033,-73.725834,43.425406,-73.706046],"v":"7395fc"}},{"id":"prospect-mountain-incline","name":"Prospect Mountain Cable Incline","town":"Lake George","reg":"adk","cat":"rail","st":"ruins","lat":43.42522,"lon":-73.74453,"prec":"exact","acc":"public","eff":"hike","tags":["inclines"],"years":"1895–1903","conf":"verified","story":"Built in six months for $120,000, it opened June 15, 1895 and hauled cars about 6,600 feet up to the Prospect Mountain House, almost 2,000 feet above the lake. It failed financially and stopped in 1903. The summit keeps its giant bull wheel and cable gears, masonry and interpretive signs; the hiking trail from the village follows the incline's route.","accn":"Summit by toll road (Veterans Memorial Highway, roughly late May to late October) or the 1.6-mile trail that follows the incline up from Smith Street.","links":[["Wikipedia","https://en.wikipedia.org/wiki/Prospect_Mountain_Veterans_Memorial_Highway"],["1895 engineering account","https://www.catskillarchive.com/rrextra/lginclin.Html"],["Lake George Examiner","https://www.lakegeorgeexaminer.com/prospect-mountain-free-2018/"]],"th":[43.42559,-73.72024],"thn":"Smith Street trailhead","dt":{"alb":[77,57.6],"sch":[70,49.6],"troy":[70,54.5],"sar":[36,26.7],"wor":[228,187.3]},"pl":["Prospect Mountain Parkway","State Department of Conservation","OA"],"tm":{"y":1897,"q":"Glens Falls, NY 1897","sc":62500,"b":[43.418033,-73.754425,43.432406,-73.734635],"v":"82b034"}},{"id":"fort-william-henry-hotel","name":"First Fort William Henry Hotel","town":"Lake George","reg":"adk","cat":"hotel","st":"gone","lat":43.4195,"lon":-73.71331,"prec":"site","acc":"public","eff":"drive","tags":["hotels"],"years":"1855–1909","conf":"verified","story":"The hotel at the head of the lake opened in June 1855 and grew to hold over 900 guests before burning on June 24, 1909. The D&H built a smaller replacement in 1911, which was itself razed in 1969; today's hotel (2004) imitates the 1911 building. Stoddard's photographs make great then-and-now material.","links":[["Chapman Museum","https://chapmanmuseum.pastperfectonline.com/photo/49E3FB35-61D6-46D2-A237-827205758426"],["Hotel history","https://www.fortwilliamhenry.com/?p=174"],["Shorpy","https://www.shorpy.com/node/10647"]],"dt":{"alb":[74,56.7],"sch":[67,48.7],"troy":[67,53.6],"sar":[33,25.8],"wor":[225,186.4]},"tm":{"y":1897,"q":"Glens Falls, NY 1897","sc":62500,"b":[43.412313,-73.723204,43.426686,-73.703416],"v":"832292"}},{"id":"graphite","name":"Graphite, the pencil boomtown","town":"Hague","reg":"adk","cat":"town","st":"ruins","lat":43.75118,"lon":-73.5629,"prec":"area","acc":"ask","eff":"walk","years":"1880s–1921","conf":"verified","story":"Dixon's American Graphite Company mined Graphite Mountain from the 1880s until 1921, supplying Dixon-Ticonderoga pencils. The hamlet of about 400 had saloons, stores and a post office; when the mine closed, buildings were moved away. The mines now shelter about 125,000 hibernating bats of six species, and mill foundations remain in the woods.","accn":"Mines are sealed for bats and much of the land is private. Start at the Hague Historical Museum for directions and permission.","links":[["HMDB","https://www.hmdb.org/m.asp?m=180292"],["Lake George Mirror via Chamber","https://lakegeorgechamber.com/blog/tracing-the-ticonderoga-pencils-roots-around-lake-george-8-27-2020"],["Atlas Obscura","https://atlasobscura.com/places/dixons-american-graphite-mill"]],"pn":"The 1897 map prints \"Graphite\" at the road junction just northwest of the pin.","dt":{"alb":[117,89.8],"sch":[111,81.8],"troy":[111,86.7],"sar":[77,59.0],"wor":[268,219.6]},"tm":{"y":1897,"q":"Paradox Lake, NY 1897","sc":62500,"b":[43.740399,-73.577823,43.761959,-73.547977],"v":"cabb87"}},{"id":"griffin","name":"Griffin ghost town","town":"Wells","reg":"adk","cat":"town","st":"ruins","lat":43.4723,"lon":-74.22292,"prec":"site","acc":"public","eff":"walk","years":"1880–1930s","conf":"verified","story":"A tannery town built around Stephen Griffin II's 1880 tannery, later the Rice Emery Company's; it was sold in 1896 and the land went to the state. Griffin turned briefly to tourism and was finished by the 1930s. The tannery foundation with its pipes, small barn remains and the Girard House survive at the start of the Auger Flats trail.","look":"Unconfirmed lead: Wells residents reportedly hauled Griffin's foundation stones home.","accn":"State land at the start of the Auger Flats trail, off Route 8.","links":[["Lake Placid News","https://www.lakeplacidnews.com/opinion/columns/2018/08/17/north-country-at-work-exploring-the-ghost-town-of-griffin-in-southern-hamilton-county/"],["Auger Flats trail","https://www.experienceouradirondacks.com/hiking/auger-flats-and-falls-river-walk"]],"pn":"The 1910 map shows the cluster of buildings and the name here, by the bridge over the East Branch.","dt":{"alb":[114,79.2],"sch":[94,62.6],"troy":[120,82.1],"sar":[90,60.5],"wor":[263,207.8]},"tm":{"y":1910,"q":"Stony Creek, NY 1910","sc":62500,"b":[43.465113,-74.232823,43.479486,-74.213017],"v":"c31f11"}},{"id":"sacandaga-park","name":"Sacandaga Park","town":"Northville","reg":"adk","cat":"amuse","st":"standing","lat":43.21567,"lon":-74.18293,"prec":"exact","acc":"public","eff":"drive","tags":["trolleyparks","amusements","drowned"],"years":"1870s–1930","conf":"verified","story":"The FJ&G Railroad turned picnic grounds near Northville into a resort; after an 1898 fire it added a midway with a roller coaster, two carousels and a ballfield on Sport Island. Rising reservoir water in 1929–30 drowned the midway and the rail line. Its railroad station survives at 136 McKinley Ave and is on the National Register; stone pillars mark the old auto entrance.","accn":"The pin is the surviving railroad station at 136 McKinley Ave. The midway is under the lake.","links":[["HMDB: Sacandaga Park","https://www.hmdb.org/m.asp?m=190499"],["HMDB: entrance pillars","https://www.hmdb.org/m.asp?m=190502"],["Lost Landmarks","https://lostlandmarks.org/atlantis.htm"],["Adirondack Experience","https://www.theadkx.org/the-birth-of-theme-parks-in-the-adirondacks/"]],"pn":"The 1899 map shows the park's street grid at the station and the river flats to the east that the reservoir later covered.","dt":{"alb":[82,57.1],"sch":[62,40.4],"troy":[88,60.0],"sar":[58,38.4],"wor":[230,185.7]},"tm":{"y":1899,"q":"Broadalbin, NY 1899","sc":62500,"b":[43.208483,-74.192791,43.222856,-74.173069],"v":"7fa681"}},{"id":"hammondville","name":"Hammondville","town":"Crown Point","reg":"adk","cat":"town","st":"ruins","lat":43.927,"lon":-73.5895,"prec":"area","acc":"ask","eff":"hike","tags":["monitor"],"years":"1870s–1890s","conf":"verified","story":"The Crown Point Iron Company's town peaked near 1,000 people, connected by a 13-mile narrow-gauge railroad to Lake Champlain, with ore shipped to Troy. It was abandoned in the 1890s when the venture failed. Crown Point iron also plated the USS Monitor, tying it to the Troy entry above.","accn":"Open mine shafts and private land. Do not go in alone; start at the Penfield Homestead Museum in Ironville for directions.","links":[["Lakes to Locks: Hammondville","https://passageport.org/journey/the-story-of-iron-in-crown-point-moriah/7-driving-to-hammondville/"],["Vizettes","https://vizettes.com/kt/rr/cpicrr/index.htm"],["UConn dissertation","https://digitalcommons.lib.uconn.edu/dissertations/AAI3476610"]],"pn":"The 1897 map shows buildings and the end of the Crown Point Iron Company railroad in this hollow. Spot not confirmed on the ground.","dt":{"alb":[144,103.0],"sch":[137,95.0],"troy":[137,99.9],"sar":[103,72.1],"wor":[273,181.5]},"pl":["Crown Point Easement","State Department of Conservation","XA"],"tm":{"y":1897,"q":"Paradox Lake, NY 1897","sc":62500,"b":[43.916219,-73.604467,43.937779,-73.574533],"v":"854d1c"}},{"id":"adirondac","name":"Adirondac (Tahawus) and McIntyre furnace","town":"Newcomb","reg":"adk","cat":"town","st":"ruins","lat":44.0872,"lon":-74.0557,"prec":"site","acc":"public","eff":"walk","years":"1826–1857; 1870s–1947","conf":"verified","story":"The best-known ghost town in the state, built around an iron mine and reachable from a trailhead lot. Included for completeness; you have likely filmed it.","links":[["Odd Things I've Seen","https://www.oddthingsiveseen.com/2012/09/the-new-york-grimpendium-tahawus-ghost.html"]],"dt":{"alb":[174,114.9],"sch":[168,106.8],"troy":[168,111.8],"sar":[134,84.0],"wor":[325,244.6]},"tm":{"y":1904,"q":"Santanoni, NY 1904","sc":62500,"b":[44.080013,-74.065705,44.094386,-74.045695],"v":"b38916"}},{"id":"dudley-observatory-1","name":"First Dudley Observatory site","town":"Albany","reg":"alb","cat":"inst","st":"gone","lat":42.66471,"lon":-73.74935,"prec":"site","acc":"public","eff":"drive","years":"1856–1893","conf":"verified","story":"The first observatory (1856) stood on \"Goat Hill,\" now Dudley Heights in Arbor Hill, until vibration from the railroad below ruined its readings.","look":"The Dudley Heights street loop and the bluff above the tracks.","hook":"Two observatory sites, zero observatories.","links":[["Dudley Observatory history","https://dudleyobservatory.org/?p=166"],["Hoxsie: Mrs. Dudley builds an observatory","https://hoxsie.org/?p=950"]],"dt":{"alb":[4,1.3],"sch":[28,17.8],"troy":[14,7.9],"sar":[45,31.0],"wor":[158,131.2]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.657523,-73.759123,42.671896,-73.739577],"v":"28714f"}},{"id":"dudley-observatory-2","name":"Second Dudley Observatory site","town":"Albany","reg":"alb","cat":"inst","st":"gone","lat":42.65434,"lon":-73.78027,"prec":"site","acc":"view","eff":"drive","years":"1893–1970","conf":"verified","story":"The second observatory rose in 1893 on the almshouse grounds on South Lake Avenue. It was sold to Albany Med in 1963, burned in 1970, and gave way to the Capital District Psychiatric Center.","look":"The psychiatric center at 75 New Scotland Ave stands on the site; pair it with the almshouse entry next door.","links":[["Dudley Observatory history","https://dudleyobservatory.org/?p=166"],["Hoxsie: Mrs. Dudley builds an observatory","https://hoxsie.org/?p=950"]],"dt":{"alb":[6,1.8],"sch":[32,17.6],"troy":[19,9.0],"sar":[49,32.1],"wor":[162,132.2]},"pl":["Capital District State Psychiatric Center","Other or Unknown State Land","OA"],"tm":{"y":1927,"q":"Albany, NY 1927","sc":62500,"b":[42.647153,-73.790042,42.661526,-73.770498],"v":"3197b1"}},{"id":"beaver-kill","name":"Beaver Kill ravine, Lincoln Park","name2":"The three lost kills","town":"Albany","reg":"alb","cat":"water","st":"traces","lat":42.644,"lon":-73.7672,"prec":"area","acc":"public","eff":"walk","years":"piped 1800s","conf":"verified","story":"Albany grew around three creeks, all now piped underground. The Beaver Kill still carves the Lincoln Park ravine, and an 1886 table ified","story":"The lot at 12 Third Street burned twice (Adelphi 1862, Griswold Hall 1871) before the Griswold Opera House rose in 1871. It was razed in 1951 for a Woolworth's, itself razed for the Uncle Sam Atrium.","look":"Rand's Opera House, later the \"Hall-Rand\" bowling hall, at Congress and Third. The Lincoln Theatre site at 73 Third St is a parking lot.","links":[["Griswold","https://www.cinematreasures.org/theaters/29382"],["Troy Theatre","https://cinematreasures.org/theaters/36804"],["Lincoln","https://www.cinematreasures.org/theaters/29916"],["Hoxsie: Trojan bowling","https://hoxsie.org/2011/04/14/trojan_bowling/"]],"dt":{"alb":[13,7.8],"sch":[29,15.8],"troy":[1,0.4],"sar":[39,28.5],"wor":[163,134.8]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.724833,-73.699794,42.739206,-73.680226],"v":"f05491"}},{"id":"troy-theatre","name":"Troy Theatre site","name2":"Troy's lost theaters","town":"Troy","reg":"troy","cat":"civic","st":"gone","lat":42.73304,"lon":-73.68994,"prec":"site","acc":"public","eff":"drive","years":"razed 1973","conf":"verified","story":"The Troy Theatre at 323 River Street fell in 1973, and the rerouted River Street now runs over it.","look":"Stand where the street bends; the old line of River Street ran straight through.","links":[["Griswold","https://www.cinematreasures.org/theaters/29382"],["Troy Theatre","https://cinematreasures.org/theaters/36804"],["Lincoln","https://www.cinematreasures.org/theaters/29916"],["Hoxsie: Trojan bowling","https://hoxsie.org/2011/04/14/trojan_bowling/"]],"dt":{"alb":[13,7.7],"sch":[29,15.7],"troy":[2,0.7],"sar":[39,28.5],"wor":[163,134.8]},"tm":{"y":1928,"q":"Troy, NY 1928","sc":62500,"b":[42.725853,-73.699724,42.740226,-73.680156],"v":"c1cd02"}},{"id":"empire-stove-works","name":"Empire Stove Works","town":"Troy","reg":"troy","cat":"industry","st":"standing","lat":42.72053,"lon":-73.69391,"prec":"site","acc":"public","eff":"drive","tags":["stove"],"years":"1846","conf":"verified","story":"The 1846 Em )","Building footprints, materials and uses, block by block, 1880s–1950s","https://www.loc.gov/collections/sanborn-maps/"],["Map Warper","Sanborn and atlas sheets already lined up on a modern map","https://mapwarper.net/"],["USGS TopoView","Old topo maps: vanished hamlets, rail lines, reservoirs before flooding","https://ngmdb.usgs.gov/topoview/"],["Historic Aerials","Mid-century aerials to date a demolition","https://www.historicaerials.com/"],["David Rumsey Map Collection","Beers county atlases and city maps","https://www.davidrumsey.com/"],["Andy Arthur's maps","Capital District overlays, including 1952 aerials of Albany and Schenectady","https://andyarthur.org/"],["OpenHistoricalMap: Capital District","Volunteer-mapped vanished features, like the Maiden Lane Bridge","https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Projects/New_York_Capital_District"],["NYS Historic Newspapers","Free digitized local papers by county","https://nyshistoricnewspapers.org/"],["Old Fulton NY Post Cards","Huge free newspaper archive; search fire, razed, demolished plus a street name","https://fultonhistory.com/"],["Hoxsie!","Albany, Schenectady and Troy history, including the 1886 bicentennial tablet series","https://hoxsie.org/"],["Albany County Hall of Records","South Mall street guides, penitentiary records, city engineer photos","https://www.albanycountyny.gov/home/showpublisheddocument/328/636982284110070000"],["NYS Museum: Colonial Albany project","Early Albany sites, burial grounds, the Manor House","https://exhibitions.nysm.nysed.gov/albany/dead.html"],["Albany Postcard Project","Postcards with \"where the photographer stood\" maps","https://www.albanypostcardproject.com/"],["Schenectady Digital History Archive","Books, trolley guides, urban-renewal studies","https://schenectadyhistory.org/"],["HistoryForge Schenectady","Census-linked building records, address by address","https://schenectady.historyforge.net/"],["Grems-Doolittle Library blog","Schenectady County then-and-now photo sets","https://gremsdoolittlelibrary.blogspot.com/"],["Lansingburgh Historical Society","Lansingburgh parks, bridges and industry, with newspaper clippings","https://www.lansingburghhistoricalsociety.org/"],["NY Heritage","Digitized photo collections from regional libraries","https://nyheritage.org/"],["Historical Marker Database","Markers with photos and GPS, including removed ones","https://www.hmdb.org/"],["Pomeroy Foundation markers","New roadside markers, often on obscure sites","https://www.wgpfoundation.org/"],["Lost New England","Then-and-now photo pairs, strong on the Catskills and Saratoga","https://lostnewengland.com/"],["Hudson Valley Ruins","Ruins documentation, brickyards to estates","https://www.hudsonvalleyruins.org/"],["Catskill Archive","Hotels, railroads and inclines of the Catskills","https://www.catskillarchive.com/"],["Vizettes","Trolley and rail rights-of-way with field photos","https://www.vizettes.com/"],["Eriecanal.org","Lock-by-lock photos of what survives","https://eriecanal.org/"],["Cinema Treasures","Demolished theaters by city","https://cinematreasures.org/theaters/united-states/new-york/troy?status=demolished"],["NPGallery (National Register)","Nomination forms with maps and history for listed sites","https://npgallery.nps.gov/"]],"tells":["Odd street widths, like Erie Boulevard, mark filled canals.","Dead-end stubs and orphaned curbs mark streets cut by highways or plazas.","Bridge abutments that line up across a river mark vanished crossings, as at Washington Avenue in Schenectady.","Brick fragments stamped with a maker's name on a shoreline mark a brickyard.","A small, oddly shaped park downtown often marks a burned or razed civic building, as at Barker Park in Troy."],"rules":["Most empty lots are private or active industrial land. Film from the public way unless you have permission.","Don't dig or remove artifacts on state land (Forest Preserve, state parks, historic sites); metal detecting there needs a permit.","NYC
