<div id="app">
  <aside id="side">
    <header class="top pad">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Lost &amp; Hidden Atlas</h1>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" id="tab-list" data-view="list" aria-selected="true">Places</button>
        <button role="tab" id="tab-near" data-view="near" aria-selected="false">Near</button>
        <button role="tab" id="tab-trip" data-view="trip" aria-selected="false">Trip<span class="n" id="trip-n">0</span></button>
        <button role="tab" id="tab-log" data-view="log" aria-selected="false">Log</button>
        <button role="tab" id="tab-guide" data-view="guide" aria-selected="false">Guide</button>
      </nav>
    </header>

    <section class="view" id="v-list" aria-labelledby="tab-list">
      <div class="tools pad">
        <div class="findbar">
          <label class="field"><span class="vh">Find a place</span>
            <input type="search" id="q" placeholder="Find a place, town or word" autocomplete="off"></label>
          <button class="btn" type="button" id="filt-btn" aria-expanded="false" aria-controls="filters">Filters<span id="fcount" class="mono"></span></button>
          <button class="btn" type="button" id="add-place" title="Add a place of your own: tap the map to drop a pin" aria-label="Add a place of your own">+ Add</button>
        </div>
        <div id="goto" hidden></div>   <!-- "go to a spot": pasted coordinates, or a street, town or address looked up when asked (goSync in app.js) -->
        <select id="home" hidden aria-hidden="true" tabindex="-1"></select>   <!-- the start place is chosen under the gear (Settings); this holds the list -->
        <details class="filters" id="filters">
          <summary hidden>Filters</summary>
          <div class="fbody" id="fbody"></div>
        </details>
      </div>
      <div id="startslot"></div>
      <div id="spotcard" hidden></div>   <!-- spots waiting to be sent for research (spotCard in app.js) -->   <!-- asks a new reader where they start from (startCard in app.js) -->
      <div class="pad">
        <div class="count" style="padding-block:8px 4px">
          <span><span id="count"></span> <button class="linkbtn" type="button" id="fclear" hidden>Clear filters</button> <button class="linkbtn" type="button" id="yrs-btn" aria-expanded="false" aria-controls="yrs" title="A bar chart of the years these places date from">Years</button></span>
          <label class="row" style="gap:5px;flex-wrap:nowrap"><span class="lbl">Sort</span>
            <select id="sort"><option value="time">Nearest first</option><option value="name">Name</option><option value="reg">Region</option><option value="left">Most left to see</option></select></label>
        </div>
        <div id="yrs" hidden></div>
      </div>
      <div class="pad" id="linechip" hidden style="padding-bottom:6px"></div>
      <ul id="list"><li class="empty pad">Loading the places…</li></ul>
    </section>

    <section class="view" id="v-detail" hidden></section>
    <section class="view" id="v-near" hidden aria-labelledby="tab-near"></section>
    <section class="view" id="v-trip" hidden aria-labelledby="tab-trip"></section>
    <section class="view" id="v-log" hidden aria-labelledby="tab-log"></section>
    <section class="view guide" id="v-guide" hidden aria-labelledby="tab-guide"></section>
  </aside>

  <main id="stage">
    <button id="mapback" class="btn sm" type="button" hidden aria-label="Back to all places" title="All places">← Back</button>
    <div id="map" role="application" aria-label="Map of sites"></div>
    <div id="loadnote" class="float" role="status">Loading the map and its places…<small>The first visit takes the longest.</small></div>   <!-- shown until app.js starts: the page is some megabytes and used to sit blank on a slow connection -->
    <div id="readout" class="float mono" hidden></div>
    <div id="lbar" role="toolbar" aria-label="Map layers and tools"><div class="lscroll" id="lscroll"></div><div class="lfix" id="lfix"></div></div>
    <div id="swipe" hidden><span class="side l" id="swipe-l"></span><span class="side r" id="swipe-r"></span><div class="grip" role="slider" aria-label="Compare divider" tabindex="0">&lt;&gt;</div></div>
    <div id="fade" class="float" hidden><span id="fade-l"></span><input type="range" id="fade-op" min="0.1" max="1" step="0.05" value="0.6" aria-label="How strongly the layer on top shows"></div>
    <div id="addbar" class="float" hidden><span>Tap the map where the place is.</span><button class="btn sm pri" id="add-centre" type="button" hidden>Place here</button><button class="btn sm" id="add-here" type="button" hidden>Where I am</button><button class="btn sm" id="add-many" type="button" hidden title="Drop many bare marks, one after another, with no form to fill in: for buildings you want researched">Spot many</button><button class="btn sm" id="spot-undo" type="button" hidden>Undo</button><button class="btn sm" id="add-cancel" type="button">Cancel</button></div>
    <div id="recbar" class="float" hidden><span class="recdot" aria-hidden="true"></span><span id="rec-t" class="mono" aria-live="off"></span><button class="btn sm" id="rec-note" type="button">+ Note</button><button class="btn sm" id="rec-stop" type="button">Stop</button><form id="rec-form" hidden><input type="text" id="rec-text" placeholder="What is here?" autocomplete="off" aria-label="Note"><button class="btn sm pri" type="submit">Save</button></form></div>
    <div id="banner" class="float" hidden></div>
    <div id="scrim" hidden></div>
    <section id="sheet" hidden role="dialog" aria-labelledby="sheet-t">
      <header><h2 id="sheet-t">Map options</h2><button class="btn" id="sheet-set" type="button" aria-label="Settings"><svg class="gear" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.1"/><circle cx="12" cy="12" r="6.7"/><path d="M12 2.6v2.7M12 18.7v2.7M2.6 12h2.7M18.7 12h2.7M5.35 5.35l1.9 1.9M16.75 16.75l1.9 1.9M5.35 18.65l1.9-1.9M16.75 7.25l1.9-1.9"/></g></svg><span class="bk">Map options</span></button><button class="btn pri" id="sheet-x" type="button">Done</button></header>
      <div id="sheet-b"></div>
    </section>
  </main>
</div>
